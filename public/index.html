const DISCM=["This guide is educational and does not replace help from a health professional. If you are worried about your mental health or someone else's, talk to a doctor or a mental health professional.","Esta guía es educativa y no sustituye la ayuda de un profesional sanitario. Si te preocupa tu salud mental o la de otra persona, habla con un médico o con un profesional de salud mental."];
const CRISIS=["If you or someone you know is in danger, or is thinking about self-harm or suicide, get help right now: tell an adult you trust and call your local emergency number or crisis line. You are not alone, and help works.","Si tú o alguien que conoces está en peligro, o piensa en hacerse daño o en quitarse la vida, pide ayuda ahora mismo: díselo a un adulto de confianza y llama al número de emergencias o a la línea de crisis de tu país. No estás solo y la ayuda funciona."];
GUIDES.feelkids={t:["My feelings","Mis emociones"],sub:["BodyWise. A short guide for children aged 5 to 9, to read with an adult.","BodyWise. Guía breve para niños de 5 a 9 años, para leer con un adulto."],disc:["This guide is educational. If you feel sad, scared or worried for a long time, tell an adult you trust.","Esta guía es educativa. Si te sientes triste, con miedo o preocupado durante mucho tiempo, cuéntaselo a un adulto de confianza."],G:[
{h:["Everybody has feelings","Todos tenemos emociones"],b:[["p",["Feelings are like little messages from our body. Happy, sad, angry, scared or calm: all feelings are okay. When we learn their names, they are easier to understand.","Las emociones son como mensajitos de nuestro cuerpo. Feliz, triste, enfadado, con miedo o tranquilo: todas las emociones están bien. Cuando aprendemos sus nombres, es más fácil entenderlas."]],
["cards",["ehappy","esad","eangry","escared","ecalm"],[["<b>Happy.</b> I feel light and I want to smile and play.","<b>Feliz.</b> Me siento ligero y quiero sonreír y jugar."],["<b>Sad.</b> I feel heavy and I may want to cry. Crying is okay.","<b>Triste.</b> Me siento pesado y puede que quiera llorar. Llorar está bien."],["<b>Angry.</b> My body feels hot and tight. I can stop and take a breath.","<b>Enfadado.</b> Mi cuerpo se siente caliente y tenso. Puedo parar y respirar."],["<b>Scared.</b> My heart beats fast. I can ask for a hug or for help.","<b>Con miedo.</b> Mi corazón late rápido. Puedo pedir un abrazo o ayuda."],["<b>Calm.</b> My body feels soft and quiet. I breathe slowly.","<b>Tranquilo.</b> Mi cuerpo se siente blando y en silencio. Respiro despacio."]],null,""]]},
{h:["What can I do with a big feeling?","¿Qué puedo hacer con una emoción grande?"],b:[["cards",["kcloud","kchat","kpencil","kplay","khrt"],[["<b>Breathe.</b> Smell the flower, blow out the candle: in through the nose, out through the mouth.","<b>Respirar.</b> Huele la flor y sopla la vela: inhala por la nariz y exhala por la boca."],["<b>Talk.</b> Tell someone I trust how I feel.","<b>Hablar.</b> Contarle a alguien de confianza cómo me siento."],["<b>Draw.</b> Draw or write what I feel.","<b>Dibujar.</b> Dibujar o escribir lo que siento."],["<b>Move.</b> Jump, run or dance for a little while.","<b>Moverme.</b> Saltar, correr o bailar un ratito."],["<b>Hug.</b> Ask for a hug, or hug a soft toy.","<b>Abrazar.</b> Pedir un abrazo o abrazar un peluche."]],null,""]]},
{h:["Try it: my feelings check-in","Pruébalo: cómo me siento hoy"],b:[["note",["Do this with an adult once a day. Look at the five faces on this guide. Point to the one that looks like you today and say why. There is no wrong answer.","Hazlo con un adulto una vez al día. Mira las cinco caritas de esta guía. Señala la que se parece a ti hoy y di por qué. No hay respuestas incorrectas."]]]},
{h:["Note for families and teachers","Nota para familias y profesores"],b:[["ul",[["Listen without rushing to fix things. You can say: I can see you feel sad.","Escucha sin apresurarte a arreglarlo todo. Puedes decir: «Veo que te sientes triste»."],["All feelings are okay, but not all behaviours are. Accept the feeling and set limits on the behaviour.","Todas las emociones están bien, pero no todas las conductas. Acepta la emoción y pon límites a la conducta."],["Keep routines for sleep, meals and play: they help children feel safe.","Mantén rutinas de sueño, comidas y juego: ayudan a los niños a sentirse seguros."],["Be a model: let children see how you calm down.","Sé un modelo: deja que los niños vean cómo te calmas."],["Talk to a doctor, a school counsellor or a mental health professional if the child is sad, worried or angry most days for weeks, has big changes in sleep or appetite, avoids friends or school, or if you are worried.","Habla con un médico, el orientador del colegio o un profesional de salud mental si el niño está triste, preocupado o enfadado casi todos los días durante semanas, tiene cambios grandes en el sueño o el apetito, evita a sus amigos o el colegio, o si te preocupa."],["If you are worried about a child's safety, contact your local emergency number or crisis service.","Si te preocupa la seguridad de un niño, contacta con el número de emergencias o con el servicio de crisis de tu país."]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["Is it okay to feel angry or sad?","¿Está bien sentirse enfadado o triste?"],["Yes. All feelings are okay.","Sí. Todas las emociones están bien."]],[["Name one thing you can do with a big feeling.","Nombra algo que puedes hacer con una emoción grande."],["Breathe, talk, draw, move or ask for a hug.","Respirar, hablar, dibujar, moverme o pedir un abrazo."]],[["Who can you tell how you feel?","¿A quién puedes contarle cómo te sientes?"],["A grown-up I trust, such as my family or a teacher.","A un adulto de confianza, como mi familia o un profesor."]],[["How does your body feel when you are calm?","¿Cómo se siente tu cuerpo cuando estás tranquilo?"],["Soft and quiet, and I breathe slowly.","Blando y en silencio, y respiro despacio."]]]]]},
{h:["Vocabulary","Vocabulario"],b:[["vocab",[["feelings","emociones"],["happy","feliz"],["sad","triste"],["angry","enfadado"],["scared","asustado"],["calm","tranquilo"],["to breathe","respirar"],["hug","abrazo"],["friend","amigo"],["to share","compartir"]]]]},
{h:["You are a Feelings Hero!","¡Eres un héroe de las emociones!"],b:[["note",["Draw your face for today and write your name: ______________","Dibuja tu cara de hoy y escribe tu nombre: ______________"]]]}
]};
GUIDES.mindteens={t:["Mind and mood","Mente y ánimo"],sub:["BodyWise. A guide for teens aged 12 to 17.","BodyWise. Guía para adolescentes de 12 a 17 años."],disc:DISCM,G:[
{h:["Your mind and your mood","Tu mente y tu ánimo"],b:[["p",["Mental health is how we think, feel and cope with life. Everybody has ups and downs, and moods change, especially in the teenage years. Looking after your mind matters as much as looking after your body.","La salud mental es cómo pensamos, sentimos y afrontamos la vida. Todo el mundo tiene altibajos, y el ánimo cambia, sobre todo en la adolescencia. Cuidar tu mente es tan importante como cuidar tu cuerpo."]]]},
{h:["Stress in your body","El estrés en tu cuerpo"],b:[["cards",["brain","hrt","st3","moon"],[["<b>Brain.</b> When it senses pressure or a threat, it releases stress hormones.","<b>Cerebro.</b> Cuando siente presión o una amenaza, libera hormonas del estrés."],["<b>Heart and breathing.</b> They speed up and the muscles tighten.","<b>Corazón y respiración.</b> Se aceleran y los músculos se tensan."],["<b>Stomach.</b> You may feel butterflies or nausea, or lose your appetite.","<b>Estómago.</b> Puedes notar mariposas o náuseas, o perder el apetito."],["<b>Sleep.</b> Worries can make it harder to fall asleep and to concentrate.","<b>Sueño.</b> Las preocupaciones pueden dificultar dormir y concentrarte."]],null,""],["note",["A little stress can help you focus. It becomes a problem when it lasts for a long time or feels too big to handle.","Un poco de estrés puede ayudarte a concentrarte. Se convierte en un problema cuando dura mucho tiempo o se siente demasiado grande."]]]},
{h:["What helps","Qué ayuda"],b:[["cards",["moon","play","chat","lungs","phone","hrt"],[["<b>Sleep.</b> Regular sleep helps mood and memory. Keep a routine and put screens away before bed.","<b>Dormir.</b> Dormir con regularidad ayuda al ánimo y a la memoria. Mantén una rutina y deja las pantallas antes de acostarte."],["<b>Move.</b> Any activity you enjoy can lift your mood and release tension.","<b>Moverte.</b> Cualquier actividad que disfrutes puede mejorar tu ánimo y liberar tensión."],["<b>Talk.</b> Sharing a worry with someone you trust makes it lighter.","<b>Hablar.</b> Compartir una preocupación con alguien de confianza la hace más ligera."],["<b>Breathe.</b> Slow breaths, in for 4 and out for 6, repeated a few times, help the body calm down.","<b>Respirar.</b> Respiraciones lentas, inhalando 4 y exhalando 6, repetidas varias veces, ayudan al cuerpo a calmarse."],["<b>Screen breaks.</b> Social media can make you compare yourself with others. Take breaks and follow accounts that make you feel good.","<b>Descansos de pantalla.</b> Las redes pueden hacer que te compares con los demás. Haz pausas y sigue cuentas que te hagan sentir bien."],["<b>Be kind to yourself.</b> Talk to yourself as you would talk to a good friend.","<b>Sé amable contigo.</b> Háblate como le hablarías a un buen amigo."]],null,""]]},
{h:["When it is more than a bad day","Cuando es más que un mal día"],b:[["p",["Many people feel sad or worried sometimes. Talk to an adult you trust or to a doctor if you notice any of these for two weeks or more:","Mucha gente se siente triste o preocupada a veces. Habla con un adulto de confianza o con un médico si notas alguna de estas señales durante dos semanas o más:"]],["warn",[["Feeling very sad, empty or hopeless on most days","Sentirte muy triste, vacío o sin esperanza casi todos los días"],["Worry you cannot switch off, or sudden panic","Preocupación que no puedes apagar, o pánico repentino"],["Losing interest in things you used to enjoy","Perder el interés en cosas que antes disfrutabas"],["Big changes in sleep or appetite","Cambios grandes en el sueño o el apetito"],["Staying away from friends and family","Alejarte de tus amigos y tu familia"],["Feeling angry or irritable much of the time, or your grades dropping","Sentirte enfadado o irritable gran parte del tiempo, o que bajen tus notas"]]],["note",["These can be signs of a health condition that can be treated, and getting help early makes a difference. They are not a weakness and they are not your fault.","Pueden ser señales de un problema de salud que se puede tratar, y pedir ayuda pronto marca la diferencia. No son una debilidad ni es culpa tuya."]]]},
{h:["How to ask for help","Cómo pedir ayuda"],b:[["ol",[["Choose someone you trust: a parent, a family member, a teacher, the school counsellor or a doctor.","Elige a alguien de confianza: tu madre o padre, un familiar, un profesor, el orientador del colegio o un médico."],["You can start with: I have been feeling ... and I would like some help.","Puedes empezar así: «Últimamente me siento ... y me gustaría recibir ayuda»."],["If speaking is hard, write it down or send a message first.","Si hablar es difícil, escríbelo o envía primero un mensaje."],["If the first person does not help, try another one. Keep asking until someone listens.","Si la primera persona no te ayuda, prueba con otra. Sigue pidiendo hasta que alguien te escuche."]]]]},
{h:["If things feel too heavy","Si todo se siente demasiado pesado"],b:[["note",[CRISIS[0],CRISIS[1]]],["note",["If a friend tells you something like this, take it seriously, stay with them and tell an adult.","Si un amigo te cuenta algo así, tómalo en serio, quédate con él y avisa a un adulto."]]]},
{h:["Myths and facts","Mitos y hechos"],b:[["table",[["Myth","Mito"],["Fact","Hecho"],[[["Mental health problems are a weakness.","Los problemas de salud mental son una debilidad."],["They are health conditions, like asthma or diabetes, and they can be treated.","Son problemas de salud, como el asma o la diabetes, y se pueden tratar."]],[["Talking about it makes it worse.","Hablar de ello lo empeora."],["Talking usually helps, and it is often the first step to feeling better.","Hablar suele ayudar, y a menudo es el primer paso para sentirse mejor."]],[["Only adults get anxiety or depression.","Solo los adultos tienen ansiedad o depresión."],["They can affect people of any age, including teenagers.","Pueden afectar a personas de cualquier edad, también a los adolescentes."]],[["You should handle it alone.","Debes resolverlo tú solo."],["Asking for help is a sign of strength, and you do not have to do it alone.","Pedir ayuda es un signo de fortaleza, y no tienes que hacerlo solo."]]]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["Name one thing that helps when you feel stressed.","Nombra algo que ayuda cuando te sientes estresado."],["For example: sleep, moving, talking to someone you trust, or slow breathing.","Por ejemplo: dormir, moverte, hablar con alguien de confianza o respirar despacio."]],[["After how long should you talk to someone if you feel very low?","¿Después de cuánto tiempo conviene hablar con alguien si te sientes muy decaído?"],["If it lasts two weeks or more, or sooner if it feels too heavy.","Si dura dos semanas o más, o antes si se siente demasiado pesado."]],[["Who can you ask for help?","¿A quién puedes pedir ayuda?"],["A parent, a family member, a teacher, a school counsellor or a doctor.","A tu madre o padre, un familiar, un profesor, el orientador del colegio o un médico."]]]]]},
{h:["Vocabulary","Vocabulario"],b:[["vocab",[["mental health","salud mental"],["mood","estado de ánimo"],["stress","estrés"],["anxiety","ansiedad"],["worry","preocupación"],["to cope","afrontar"],["support","apoyo"],["counsellor","orientador"],["to ask for help","pedir ayuda"],["well-being","bienestar"]]]]}
]};
GUIDES.mindadults={t:["Mental wellbeing for adults","Bienestar mental para adultos"],sub:["BodyWise. Educational guide for adults.","BodyWise. Guía educativa para adultos."],disc:DISCM,G:[
{h:["Looking after your mind","Cuidar tu mente"],b:[["p",["Mental wellbeing is not only the absence of illness. It is feeling able to cope with everyday stress, work, relationships and change. Like physical health, it goes up and down, and it can be looked after.","El bienestar mental no es solo la ausencia de enfermedad. Es sentirte capaz de afrontar el estrés diario, el trabajo, las relaciones y los cambios. Como la salud física, sube y baja, y se puede cuidar."]]]},
{h:["Signs of stress and burnout","Señales de estrés y agotamiento"],b:[["ul",[["Constant tiredness, even after resting","Cansancio constante, incluso después de descansar"],["Trouble concentrating or making decisions","Dificultad para concentrarte o tomar decisiones"],["Irritability, or feeling overwhelmed","Irritabilidad o sensación de estar desbordado"],["Headaches, muscle tension or stomach problems","Dolores de cabeza, tensión muscular o problemas de estómago"],["Trouble sleeping, or feeling detached from work or people","Problemas para dormir, o sentirte distante del trabajo o de las personas"]]]]},
{h:["Daily habits that help","Hábitos diarios que ayudan"],b:[["cards",["moon","play","chat","cal","leaf","hrt"],[["<b>Sleep.</b> Keep regular hours and wind down before bed.","<b>Dormir.</b> Mantén horarios regulares y relájate antes de acostarte."],["<b>Move.</b> Regular physical activity improves mood and reduces stress.","<b>Moverte.</b> La actividad física regular mejora el ánimo y reduce el estrés."],["<b>Connect.</b> Spend time with people who support you.","<b>Conectar.</b> Pasa tiempo con personas que te apoyan."],["<b>Set limits.</b> Take breaks, and protect time off work.","<b>Poner límites.</b> Haz pausas y protege tu tiempo libre."],["<b>Fresh air.</b> A walk outside can clear your head.","<b>Aire libre.</b> Un paseo al aire libre puede despejarte la cabeza."],["<b>Enjoy.</b> Make time for things you like.","<b>Disfrutar.</b> Haz tiempo para lo que te gusta."]],null,""]]},
{h:["When to seek help","Cuándo buscar ayuda"],b:[["p",["Talk to a doctor or a mental health professional if you notice any of these for two weeks or more, or if they get in the way of daily life:","Habla con un médico o con un profesional de salud mental si notas alguna de estas señales durante dos semanas o más, o si interfieren en tu vida diaria:"]],["warn",[["Feeling sad, empty or hopeless most days","Sentirte triste, vacío o sin esperanza casi todos los días"],["Constant worry, panic or fear","Preocupación, pánico o miedo constantes"],["Losing interest in things you used to enjoy","Perder el interés en lo que antes disfrutabas"],["Big changes in sleep or appetite","Cambios grandes en el sueño o el apetito"],["Using alcohol or other substances to cope","Usar alcohol u otras sustancias para sobrellevarlo"]]],["note",["These problems are common and treatable. Asking for help early is a sign of strength.","Estos problemas son frecuentes y tienen tratamiento. Pedir ayuda pronto es un signo de fortaleza."]]]},
{h:["How to get support","Cómo conseguir apoyo"],b:[["ol",[["Talk to your doctor: it is a good first step.","Habla con tu médico: es un buen primer paso."],["Ask about a psychologist, therapist or counselling service.","Pregunta por un psicólogo, terapeuta o servicio de orientación."],["Find out if your workplace offers support.","Averigua si tu trabajo ofrece apoyo."],["Tell a friend or relative you trust how you feel.","Cuéntale a un amigo o familiar de confianza cómo te sientes."]]]]},
{h:["Supporting someone else","Apoyar a otra persona"],b:[["ol",[["Listen without judging or rushing to fix things.","Escucha sin juzgar ni apresurarte a arreglarlo."],["Ask directly how they are, and give them time to answer.","Pregunta directamente cómo están y dales tiempo para responder."],["Encourage them to talk to a professional, and offer to help find one.","Anímales a hablar con un profesional y ofrécete a ayudarles a encontrarlo."],["Keep in touch. Small messages matter.","Mantén el contacto. Los mensajes pequeños importan."]]],["note",[CRISIS[0],CRISIS[1]]]]},
{h:["Myths and facts","Mitos y hechos"],b:[["table",[["Myth","Mito"],["Fact","Hecho"],[[["Mental health problems are rare.","Los problemas de salud mental son raros."],["They are very common: many people will have one at some point.","Son muy frecuentes: muchas personas tendrán uno en algún momento."]],[["You should just snap out of it.","Solo tienes que animarte."],["They are health conditions, not a lack of willpower, and they need care.","Son problemas de salud, no falta de voluntad, y necesitan cuidados."]],[["Therapy and medication are only for severe cases.","La terapia y la medicación son solo para casos graves."],["Professionals can help at any stage, and treatment is better started early.","Los profesionales pueden ayudar en cualquier etapa, y conviene empezar el tratamiento pronto."]]]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["Name two daily habits that help your mental wellbeing.","Nombra dos hábitos diarios que ayudan a tu bienestar mental."],["For example: sleep, movement, connecting with others or taking breaks.","Por ejemplo: dormir, moverte, conectar con otras personas o hacer pausas."]],[["After how long should you seek help for low mood or constant worry?","¿Después de cuánto tiempo conviene buscar ayuda por ánimo bajo o preocupación constante?"],["If it lasts two weeks or more, or if it affects daily life.","Si dura dos semanas o más, o si afecta a la vida diaria."]]]]]},
{h:["Learn more","Para saber más"],b:[["p",["Check official sources, such as the World Health Organization or your national health authority, to find services in your country.","Consulta fuentes oficiales, como la Organización Mundial de la Salud o la autoridad sanitaria de tu país, para encontrar servicios en tu país."]]]}
]};
GUIDES.feelhome={t:["Talking about feelings at home","Hablar de emociones en casa"],sub:["BodyWise. A guide for parents and carers.","BodyWise. Guía para madres, padres y cuidadores."],disc:DISCM,G:[
{h:["Why it matters","Por qué es importante"],b:[["p",["Children and teens who can name and talk about their feelings cope better with stress and feel safer. You do not need to have all the answers: listening is the most powerful thing you can do.","Los niños y adolescentes que pueden nombrar y hablar de sus emociones afrontan mejor el estrés y se sienten más seguros. No necesitas tener todas las respuestas: escuchar es lo más poderoso que puedes hacer."]]]},
{h:["5 steps to listen","5 pasos para escuchar"],b:[["cards",["eye","chat","hrt","shield","group"],[["<b>Stop and look.</b> Put the phone away and give your full attention.","<b>Párate y mira.</b> Deja el móvil y dedica toda tu atención."],["<b>Name the feeling.</b> You seem worried about tomorrow. Is that right?","<b>Nombra la emoción.</b> «Pareces preocupado por mañana. ¿Es así?»"],["<b>Validate.</b> It makes sense that you feel that way.","<b>Valida.</b> «Es normal que te sientas así.»"],["<b>Set limits on behaviour.</b> All feelings are okay; hurting others or things is not.","<b>Pon límites a la conducta.</b> Todas las emociones están bien; hacer daño a otros o a las cosas, no."],["<b>Solve it together.</b> What could help? What can we try?","<b>Resolvedlo juntos.</b> «¿Qué podría ayudar? ¿Qué podemos probar?»"]],null,""]]},
{h:["Talking by age","Hablar según la edad"],b:[["table",[["Age","Edad"],["What helps","Qué ayuda"],[[["5 to 9 years","De 5 a 9 años"],["Use simple words, faces and drawings. Play and stories help them name feelings.","Usa palabras sencillas, caritas y dibujos. El juego y los cuentos les ayudan a nombrar las emociones."]],[["10 to 12 years","De 10 a 12 años"],["Talk while doing something together, like walking or cooking. Ask open questions.","Habla mientras hacéis algo juntos, como pasear o cocinar. Haz preguntas abiertas."]],[["13 to 17 years","De 13 a 17 años"],["Respect privacy, stay available and listen more than you advise. Choose calm moments.","Respeta su intimidad, mantente disponible y escucha más de lo que aconsejas. Elige momentos tranquilos."]]]]]]},
{h:["Routines that protect wellbeing","Rutinas que protegen el bienestar"],b:[["ul",[["Regular sleep, with screens away before bed","Sueño regular, con las pantallas apartadas antes de acostarse"],["Family meals and time to talk","Comidas en familia y tiempo para hablar"],["Daily play, movement and time outdoors","Juego, movimiento y tiempo al aire libre cada día"],["Clear and kind rules about screens","Normas claras y amables sobre las pantallas"]]]]},
{h:["Signs to watch","Señales a las que prestar atención"],b:[["warn",[["Sadness, worry or anger on most days for weeks","Tristeza, preocupación o enfado casi todos los días durante semanas"],["Big changes in sleep, appetite or energy","Cambios grandes en el sueño, el apetito o la energía"],["Avoiding friends, school or things they used to enjoy","Evitar a los amigos, el colegio o lo que antes disfrutaban"],["Falling grades, or frequent headaches and stomach aches with no clear cause","Notas que bajan, o dolores de cabeza y de barriga frecuentes sin causa clara"]]]]},
{h:["Where to get help","Dónde conseguir ayuda"],b:[["ul",[["Start with your family doctor or paediatrician.","Empieza por tu médico de familia o pediatra."],["Talk to the school counsellor or teacher.","Habla con el orientador o el tutor del colegio."],["Ask about child and adolescent mental health services in your area.","Pregunta por los servicios de salud mental infantil y juvenil de tu zona."]]],["note",[CRISIS[0],CRISIS[1]]]]},
{h:["Look after yourself too","Cuídate tú también"],b:[["ul",[["You cannot pour from an empty cup: sleep, eat and rest.","No puedes dar lo que no tienes: duerme, come y descansa."],["Ask for support from family, friends or a professional.","Pide apoyo a familiares, amigos o a un profesional."],["It is okay to say: I need a moment, and we will talk soon.","Está bien decir: «Necesito un momento y hablamos enseguida»."]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["What is the most powerful thing you can do when a child is upset?","¿Qué es lo más poderoso que puedes hacer cuando un niño está disgustado?"],["Listen and show you understand.","Escuchar y mostrar que lo entiendes."]],[["Are all feelings okay? And all behaviours?","¿Están bien todas las emociones? ¿Y todas las conductas?"],["All feelings are okay, but not all behaviours.","Todas las emociones, pero no todas las conductas."]]]]]}
]};
GUIDES.feelschool={t:["Emotional wellbeing in the classroom","Bienestar emocional en el aula"],sub:["BodyWise. A guide for teachers and school staff.","BodyWise. Guía para profesores y personal del colegio."],disc:DISCM,G:[
{h:["Why it matters at school","Por qué importa en el colegio"],b:[["p",["Students who feel safe and understood learn better. Teachers cannot be therapists, but small daily practices help students recognise their feelings and know that someone is there.","Los alumnos que se sienten seguros y comprendidos aprenden mejor. Los profesores no pueden ser terapeutas, pero pequeñas prácticas diarias ayudan a los alumnos a reconocer sus emociones y a saber que alguien está ahí."]]]},
{h:["Daily practices","Prácticas diarias"],b:[["cards",["hrt","leaf","lungs","group","cal"],[["<b>Morning check-in.</b> Each student shows or says how they feel in one word.","<b>Registro de la mañana.</b> Cada alumno muestra o dice cómo se siente con una palabra."],["<b>Calm corner.</b> A quiet place with soft objects where students can pause.","<b>Rincón de la calma.</b> Un lugar tranquilo con objetos suaves donde los alumnos pueden parar."],["<b>Breathing break.</b> One minute of slow breathing before a test or after break.","<b>Pausa de respiración.</b> Un minuto de respiración lenta antes de un examen o después del recreo."],["<b>Kindness round.</b> Students share one kind thing they noticed.","<b>Ronda de amabilidad.</b> Los alumnos comparten algo amable que han visto."],["<b>Clear routines.</b> Predictable days help students feel safe.","<b>Rutinas claras.</b> Los días predecibles ayudan a los alumnos a sentirse seguros."]],null,""]]},
{h:["A 15-minute session plan","Una sesión de 15 minutos"],b:[["table",[["Time","Tiempo"],["Activity","Actividad"],[[["0 to 3 minutes","De 0 a 3 minutos"],["Check-in: students point to a feelings face and say one word.","Registro: los alumnos señalan una carita y dicen una palabra."]],[["3 to 10 minutes","De 3 a 10 minutos"],["Activity: read a short story or play a game about one feeling, for example feeling worried.","Actividad: leer un cuento corto o jugar a un juego sobre una emoción, por ejemplo la preocupación."]],[["10 to 15 minutes","De 10 a 15 minutos"],["Reflection: what can we do when we feel this way? Finish with slow breathing.","Reflexión: ¿qué podemos hacer cuando nos sentimos así? Termina con respiración lenta."]]]]]]},
{h:["Signs a student may need support","Señales de que un alumno puede necesitar apoyo"],b:[["warn",[["Sadness, worry or anger that lasts for weeks","Tristeza, preocupación o enfado que duran semanas"],["Pulling away from friends or classroom activities","Alejarse de los amigos o de las actividades del aula"],["Big changes in behaviour, attendance or grades","Cambios grandes en la conducta, la asistencia o las notas"],["Frequent headaches or stomach aches with no clear cause","Dolores de cabeza o de barriga frecuentes sin causa clara"]]]]},
{h:["How to respond","Cómo responder"],b:[["ol",[["Find a private moment and say what you have noticed, kindly.","Busca un momento privado y di con amabilidad lo que has notado."],["Listen, do not judge, and do not promise to keep a secret if safety is at risk.","Escucha, no juzgues y no prometas guardar un secreto si hay riesgo para su seguridad."],["Tell the school counsellor or the person in charge, following your school's protocol.","Informa al orientador o al responsable del centro, siguiendo el protocolo de tu colegio."],["Keep the family informed, as your school's protocol says.","Mantén informada a la familia, según el protocolo de tu colegio."]]],["note",[CRISIS[0],CRISIS[1]]]]},
{h:["Look after yourself too","Cuídate tú también"],b:[["ul",[["Share the load with colleagues and ask for support.","Comparte la carga con tus compañeros y pide apoyo."],["Protect time to rest and switch off.","Protege el tiempo para descansar y desconectar."],["You are not alone: your school and your doctor can help you too.","No estás solo: tu colegio y tu médico también pueden ayudarte."]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["Name one daily practice that supports students' wellbeing.","Nombra una práctica diaria que apoye el bienestar de los alumnos."],["For example: morning check-in, calm corner, breathing break or kindness round.","Por ejemplo: registro de la mañana, rincón de la calma, pausa de respiración o ronda de amabilidad."]],[["What should you do if a student's safety is at risk?","¿Qué debes hacer si la seguridad de un alumno está en riesgo?"],["Tell the person in charge following your school's protocol, and call emergency services if needed.","Informar al responsable según el protocolo del colegio y llamar a emergencias si hace falta."]]]]]}
]};
Object.assign(READ,{"My feelings":"feelkids","Mind and mood":"mindteens","Mental wellbeing for adults":"mindadults","Talking about feelings at home":"feelhome","Emotional wellbeing in the classroom":"feelschool"});
function blk(b){const k=b[0],v=b[1];
if(k==="p")return `<p>${L(v)}</p>`;
if(k==="h3")return `<h3>${L(v)}</h3>`;
if(k==="note")return `<aside class="note">${L(v)}</aside>`;
if(k==="ul"||k==="warn"||k==="dont")return `<ul class="gl ${k}">${v.map(x=>`<li>${L(x)}</li>`).join("")}</ul>`;
if(k==="ol")return `<ol class="gl">${v.map(x=>`<li>${L(x)}</li>`).join("")}</ol>`;
if(k==="img")return `<figure>${IMG[v]()}<figcaption>${L(["Tap the drawing to enlarge it.","Toca el dibujo para ampliarlo."])}</figcaption></figure>`;
if(k==="cards"){const items=b[2],refs=b[3],cls=b[4]||"";return `<div class="cards">${items.map((x,n)=>`<div class="cd ${cls}"><span class="kn">${n+1}</span><svg viewBox="0 0 64 64" aria-hidden="true">${IC[v[n]]}</svg><p>${L(x)}${refs&&refs[n]?[...refs[n]].map(d=>`<span class="kb">${d}</span>`).join(""):""}</p></div>`).join("")}</div>`}
if(k==="kit")return `<div class="kit">${v.map((x,n)=>`<div><span class="kn">${n+1}</span>${ico(KI[x[0]])}<b>${L(x[1])}</b><small>${L(x[2])}</small></div>`).join("")}</div>`;
if(k==="ols")return `<ol class="gl">${v.map((x,n)=>`<li>${L(x)}${[...b[2][n]].map(d=>`<span class="kb">${d}</span>`).join("")}</li>`).join("")}</ol>`;
if(k==="table")return `<div class="tw"><table><thead><tr><th>${L(v[0])}</th><th>${L(v[1])}</th></tr></thead><tbody>${v[2].map(r=>`<tr><td>${L(r[0])}</td><td>${L(r[1])}</td></tr>`).join("")}</tbody></table></div>`;
if(k==="vocab")return `<div class="tw"><table><thead><tr><th>English</th><th>Español</th></tr></thead><tbody>${v.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table></div>`;
if(k==="chart"){const dy=E==="es"?["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"]:E==="bi"?["Mon / Lun","Tue / Mar","Wed / Mié","Thu / Jue","Fri / Vie","Sat / Sáb","Sun / Dom"]:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];const rw=[["Morning","Mañana"],["After school","Después del cole"],["Before dinner","Antes de cenar"]];return `<div class="tw"><table class="wk"><thead><tr><th></th>${dy.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${rw.map(r=>`<tr><th>${L(r)}</th>${dy.map(()=>`<td><button type="button" class="star" aria-pressed="false" aria-label="star"></button></td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
if(k==="bylang")return v[E==="es"?"es":"en"].map(blk).join("");
if(k==="pic"){const u=PIC[v];return u?`<figure class="pic"><img src="${u[E==="es"?"es":"en"]||u.es}" alt="" data-zoom="1"><figcaption>${L(["Tap the image to enlarge it.","Toca la imagen para ampliarla."])}</figcaption></figure>`:""}
if(k==="quiz")return v.map((q,i)=>`<details class="q"><summary>${i+1}. ${L(q[0])}</summary><p>${L(q[1])}</p></details>`).join("");
return ""}
const R=document.getElementById("reader");
function paint(){
document.querySelectorAll("#reader .eds button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.e===E));
document.getElementById("rclose").textContent=T[lang].close;
const g=GUIDES[GK],rb=document.getElementById("rbody");rb.className="rcol"+(/^(hands|digkids|respkids|feelkids)$/.test(GK)?" kids":"");rb.innerHTML=`<h1>${L(g.t)}</h1><p class="sub">${L(g.sub)}</p><aside class="note">${L(g.disc)}</aside>${picHtml(g)}`+g.G.map((s,i)=>`<section><h2>${i+1}. ${L(s.h)}</h2>${s.b.map(blk).join("")}</section>`).join("")+`<aside class="note">${L(g.disc)}</aside>`}
function closeR(){R.hidden=true;document.body.style.overflow=""}
document.addEventListener("click",e=>{const b=e.target.closest("[data-read]");if(!b)return;const s=b.closest(".card").querySelector(".ed");E=["en","es","bi"][s?s.selectedIndex:0];GK=b.dataset.read;paint();R.hidden=false;document.body.style.overflow="hidden";R.scrollTop=0;document.getElementById("rclose").focus()});
document.querySelectorAll("#reader .eds button").forEach(b=>b.addEventListener("click",()=>{E=b.dataset.e;paint()}));
document.getElementById("rclose").addEventListener("click",closeR);
const ZV=document.getElementById("zoomv");
function closeZ(){ZV.hidden=true}
document.addEventListener("click",e=>{const z=e.target.closest("[data-zoom]");if(!z)return;const zs=ZV.querySelector(".zs");zs.innerHTML=`<img alt="" src="${z.src}">`;ZV.hidden=false;zs.scrollTop=0;document.getElementById("zclose").focus()});
document.addEventListener("click",e=>{const f=e.target.closest("#rbody figure:not(.pic)");if(!f)return;const sv=f.querySelector("svg");if(!sv)return;const zs=ZV.querySelector(".zs");zs.innerHTML=`<div class="zsv">${sv.outerHTML}</div>`;ZV.hidden=false;zs.scrollTop=0;document.getElementById("zclose").focus()});
document.getElementById("zclose").addEventListener("click",closeZ);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!ZV.hidden)closeZ();else if(!R.hidden)closeR()}});

setLang(lang);
