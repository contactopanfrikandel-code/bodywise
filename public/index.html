<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="BodyWise: guías de salud didácticas para niños, adolescentes, adultos, familias y escuelas / Educational health guides for kids, teens, adults, families and schools.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BodyWise | Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F6F8FA;--surface:#FFFFFF;--ink:#0F2A3D;--muted:#3D5363;--line:#D8E0E7;
  --brand:#14507A;--brand-ink:#FFFFFF;--sun:#E6B450;--mint:#D6EBE4;--sky:#D9E6F2;--rose:#F1DEE0;
  --head:"Manrope","Segoe UI",system-ui,sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1D22;--surface:#162A31;--ink:#E6F1F4;--muted:#B4CAD2;--line:#274047;
  --brand:#5CC3D3;--brand-ink:#0B1A1E;--sun:#FFC857;--mint:#1D4036;--sky:#1C3947;--rose:#4A2A30;}}
:root[data-theme="dark"]{
  --bg:#0E1D22;--surface:#162A31;--ink:#E6F1F4;--muted:#B4CAD2;--line:#274047;
  --brand:#5CC3D3;--brand-ink:#0B1A1E;--sun:#FFC857;--mint:#1D4036;--sky:#1C3947;--rose:#4A2A30;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 var(--body)}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.banner{background:var(--ink);color:var(--bg);text-align:center;font-size:.9rem;padding:8px 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;flex-wrap:wrap}
.logo{font-family:var(--head);font-weight:800;font-size:1.4rem;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo span{background:var(--sun);color:#0F2A3D;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav a{text-decoration:none;font-weight:700;color:var(--muted)}
nav a:hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding:48px 0 56px}
.hero h1{font-size:clamp(2.3rem,6vw,4rem);font-weight:800;letter-spacing:-.01em}
.hero p{color:var(--muted);font-size:1.2rem;max-width:34em;margin:18px 0 28px}
.btn{display:inline-block;background:var(--brand);color:var(--brand-ink);font:700 1.05rem var(--body);border:0;border-radius:10px;padding:14px 26px;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);margin-left:8px}
.btn:hover{filter:brightness(1.08)}
.stack{position:relative;height:340px}
.sheet{position:absolute;width:62%;aspect-ratio:3/4;border-radius:20px;border:2px solid var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:18px;font-family:var(--head);font-weight:800;font-size:1.25rem;line-height:1.1}
.sheet i{font-style:normal;font-size:3.2rem}
.s1{background:var(--mint);left:0;top:30px;transform:rotate(-7deg)}
.s2{background:var(--sun);left:19%;top:0;transform:rotate(3deg);color:#0F2A3D}
.s3{background:var(--sky);right:0;top:46px;transform:rotate(9deg)}
.sheet small{font:600 .85rem var(--body);opacity:.8}
section{padding:56px 0}
.lead{max-width:40em;color:var(--muted);margin:10px 0 28px}
h2{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.tab{font:700 1rem var(--body);background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 20px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cover{height:130px;display:grid;place-items:center;font-size:3.4rem}
.card .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.3rem}
.card p{margin:0;color:var(--muted);font-size:.98rem}
.meta{font-size:.9rem;color:var(--muted)}
.buy{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px}
.price{font:800 1.4rem var(--head)}
.btn.small{padding:8px 18px;font-size:.95rem}
.pack{margin-top:26px;background:var(--sun);color:#0F2A3D;border-radius:12px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.pack b{font-family:var(--head);font-size:1.3rem}
.pack .btn{background:#0F2A3D;color:#fff}
.about{display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px}
.avatar{width:200px;height:200px;border-radius:50%;background:var(--rose);display:grid;place-items:center;font-size:5rem;border:2px dashed var(--line)}
.about p{color:var(--muted);margin:12px 0 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:800 1.1rem var(--head);margin-bottom:12px}
.steps h3{font-size:1.2rem;margin-bottom:6px}
.steps p{margin:0;color:var(--muted)}
.news{background:var(--brand);color:var(--brand-ink);border-radius:24px;padding:36px;text-align:center}
.news p{margin:10px auto 20px;max-width:34em;opacity:.92}
.news form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.news input{font:inherit;padding:13px 18px;border-radius:10px;border:0;min-width:240px;max-width:100%}
.news .btn{background:var(--sun);color:#0F2A3D}
footer{padding:36px 0 48px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);margin-top:56px}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:24px}
  .stack{height:300px;order:-1}
  .about{grid-template-columns:1fr;text-align:center;justify-items:center}
  .btn.alt{margin:10px 0 0}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:drop .7s cubic-bezier(.2,.8,.3,1) both}
  .s2{animation-delay:.12s}.s3{animation-delay:.24s}
  @keyframes drop{from{opacity:0;translate:0 -24px}to{opacity:1;translate:0 0}}
}
.lang{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{font:700 .9rem var(--body);background:transparent;color:var(--ink);border:0;padding:8px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ed{font:inherit;font-size:.9rem;padding:5px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-left:4px}
.steps.plain li::before{display:none}
.logo b{font-weight:800}
#reader{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#reader[hidden]{display:none}
.rbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.rwrap{max-width:1000px;margin:0 auto;padding:12px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rcol{max-width:1000px;margin:0 auto;padding:10px 20px 70px}
.eds{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.eds button{font:700 .9rem var(--body);background:transparent;color:var(--ink);border:0;padding:8px 12px;cursor:pointer}
.eds button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rcol h1{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:800;margin:18px 0 6px}
.rcol h2{font-size:1.45rem;font-weight:800;margin:40px 0 10px;padding-top:14px;border-top:3px solid var(--brand)}
.rcol h3{font-size:1.15rem;margin:22px 0 6px}
.rcol .sub{color:var(--muted);margin:0 0 12px}
.rcol p,.rcol li{max-width:62em}
.note{border-left:5px solid var(--sun);background:var(--surface);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0}
.gl{padding-left:1.3em}.gl li{margin:8px 0}
.warn,.dont{list-style:none;padding-left:0}
.warn li,.dont li{padding-left:30px;position:relative}
.warn li::before{content:"!";position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;background:#C0392B;color:#fff;font:800 .8rem/20px var(--head);text-align:center}
.dont li::before{content:"\2715";position:absolute;left:2px;top:0;color:#C0392B;font-weight:800}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bi>span:last-child{color:var(--muted);border-left:2px solid var(--line);padding-left:14px}
figure{margin:18px 0;background:#fff;border:1px solid #D8E0E7;border-radius:12px;padding:12px}
figure svg{width:100%;height:auto;display:block}
.sk{fill:#D9E6F2;stroke:#0F2A3D;stroke-width:2}.gz{fill:#fff;stroke:#0F2A3D;stroke-width:2}.mt{fill:#8A9BA8;stroke:#0F2A3D;stroke-width:2}.ep{fill:#F1DEE0;stroke:#0F2A3D;stroke-width:1.5}
.ar{stroke:#14507A;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.sl{font:700 14px var(--body);fill:#0F2A3D}.s2{font-weight:400;fill:#3D5363;font-size:13.5px}.sn{font:800 18px var(--head);fill:#fff}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:14px 0}
.kit>div{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 16px;text-align:center}
.kit svg{width:100%;max-width:170px;height:auto;display:block;margin:0 auto 8px}
.kit b{display:block;font-family:var(--head);font-size:1rem;line-height:1.3}
.kit small{display:block;color:var(--muted);font-size:.9rem;margin-top:6px}
.kit .bi{grid-template-columns:1fr;gap:2px}.kit .bi>span:last-child{border-left:0;padding-left:0}
.kn,.kb{display:inline-grid;place-items:center;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:800 .75rem var(--head)}
.kn{position:absolute;left:10px;top:10px;width:26px;height:26px;font-size:.9rem}
.kb{width:21px;height:21px;margin-left:6px;vertical-align:1px}
.tw{overflow-x:auto}
.rcol table{border-collapse:collapse;width:100%;background:var(--surface)}
.rcol th,.rcol td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.rcol th{font-family:var(--head)}
details.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0}
details.q summary{cursor:pointer;font-weight:700}
@media (max-width:700px){.bi{grid-template-columns:1fr;gap:4px}.bi>span:last-child{border-left:0;padding-left:0}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin:16px 0}
.cd{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.cd svg{width:64px;height:64px}.cd p{margin:0}
.cd .kn{left:-8px;top:-8px;box-shadow:0 0 0 3px var(--bg)}
.cd.warn{border-left:5px solid #C0392B}
.cd .bi{grid-template-columns:1fr;gap:2px}.cd .bi>span:last-child{border-left:0;padding-left:0}
.cd .kb{vertical-align:2px}
.kids{font-size:1.1rem}.kids h2{border-top-color:var(--sun)}.kids .cd{padding:18px}.kids .cd svg{width:78px;height:78px}.kids .cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.kids .cd{grid-template-columns:78px 1fr}
.wk{text-align:center}.wk th{font-size:.85rem;white-space:nowrap}.wk tbody th{text-align:left}
.star{width:36px;height:36px;border-radius:50%;border:2px dashed var(--line);background:transparent;cursor:pointer;font-size:1.3rem;line-height:1}
.star[aria-pressed="true"]{background:var(--sun);border:2px solid #B8862B;color:#fff}.star[aria-pressed="true"]::after{content:"\2605"}
.pic{margin:16px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.pic img{width:100%;height:auto;display:block;border-radius:8px;cursor:zoom-in}
.pic figcaption{font-size:.9rem;color:var(--muted);text-align:center;margin-top:6px}
.covimg{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
#zoomv{position:fixed;inset:0;z-index:80;background:rgba(10,20,28,.92);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#zoomv[hidden]{display:none}
#zclose{align-self:flex-end;margin:10px 14px}
.zs{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.zs img{width:1200px;max-width:none;display:block;margin:0 auto}
.rcol figure:not(.pic) svg{cursor:zoom-in}
.rcol figcaption{font-size:.9rem;color:var(--muted);text-align:center;margin-top:6px}
.zsv{width:1100px;max-width:none;margin:6px 12px 20px;background:#fff;border-radius:12px;padding:14px}
.zsv svg{width:100%;height:auto;display:block}
.rcol figure:not(.pic) figcaption{color:#3D5363}
.cover svg{width:100%;height:100%;display:block}
.acts{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.soon{font-size:.8rem;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:5px 9px}
.btn.small.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);padding:6px 14px}
</style>
</head>

F"/></linearGradient><linearGradient id="gdia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E58F8F"/><stop offset="1" stop-color="#B04A55"/></linearGradient><linearGradient id="tcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2A3D"/><stop offset="1" stop-color="#1A5C7A"/></linearGradient><linearGradient id="acg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3E2"/><stop offset="1" stop-color="#F6D5B0"/></linearGradient><linearGradient id="hcg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4FBFC"/><stop offset="1" stop-color="#D4EEF0"/></linearGradient></defs></svg>

<div class="wrap">

const DISC=["This guide is educational and does not replace advice from a healthcare professional. If in doubt, contact your doctor, your nurse or your local emergency services.","Esta guía es educativa y no sustituye la consulta con un profesional sanitario. Ante la duda, consulta a tu médico, a tu enfermera o a los servicios de urgencias."];
const G=[
{h:["When NOT to treat at home","Cuándo NO curar en casa"],b:[
["p",["Small wounds can be treated at home. Go to the emergency department or call your local emergency number if:","Las heridas pequeñas se pueden tratar en casa. Acude a urgencias o llama al número de emergencias de tu país si:"]],
["cards",["w1","w2","w3","w4","w5","w6","w7","w8","w9"],[["Bleeding does not stop after 10 minutes of firm, continuous pressure.","El sangrado no se detiene tras 10 minutos de presión firme y continua."],["The wound is deep, its edges are separated, or you can see fat, muscle or bone.","La herida es profunda, tiene los bordes separados o se ve grasa, músculo o hueso."],["An object is embedded in the wound. Do not remove it: keep it still and get help.","Hay un objeto clavado. No lo retires: inmoviliza y pide ayuda."],["The wound is on the face, near the eyes, over a joint or on the genitals.","La herida está en la cara, cerca de los ojos, en una articulación o en los genitales."],["It is an animal or human bite.","Es una mordedura de animal o de persona."],["There is a lot of dirt that will not wash out, or the wound was caused by something rusty or contaminated.","Hay mucha suciedad que no sale al limpiar, o la herida se hizo con algo oxidado o contaminado."],["You are not sure your tetanus vaccination is up to date.","No sabes si tu vacuna del tétanos está al día."],["The person is pale, sweaty, confused or faints.","La persona está pálida, sudorosa, confusa o se desmaya."],["The burn is large, chemical or electrical, or is on the face, hands, feet, joints or genitals.","La quemadura es grande, química, eléctrica, o está en cara, manos, pies, articulaciones o genitales."]],null,"warn"],
["note",["Take extra care, and speak to your doctor first, if you have diabetes, poor circulation or a weak immune system, or if you take blood thinners. The same applies to young children and older adults.","Ten especial cuidado, y consulta antes a tu médico, si tienes diabetes, mala circulación, defensas bajas o tomas anticoagulantes, y también en niños pequeños y personas mayores."]]]},
{h:["Your basic wound-care kit","Tu kit básico de curas"],b:[
["p",["Each item is numbered. The same number appears in the steps that use it, shown as a circled number.","Cada artículo lleva un número. El mismo número aparece, dentro de un círculo, en los pasos que lo usan."]],
["kit",[["gloves",["Disposable gloves and mild soap","Guantes desechables y jabón neutro"],["Used in: step 1","Se usa en: paso 1"]],["saline",["Saline solution or clean drinking water","Suero fisiológico o agua potable limpia"],["Used in: step 3","Se usa en: paso 3"]],["gauze",["Sterile gauze and dressings in several sizes","Gasas estériles y apósitos de varios tamaños"],["Used in: steps 2, 5 and 6","Se usan en: pasos 2, 5 y 6"]],["bandage",["Adhesive bandages, hypoallergenic tape and a bandage roll","Tiritas, esparadrapo hipoalergénico y venda"],["Used in: steps 5 and 6","Se usan en: pasos 5 y 6"]],["tools",["Scissors and tweezers, cleaned before each use","Tijeras y pinzas, desinfectadas antes de cada uso"],["Tweezers: step 3. Scissors: to trim gauze or tape, steps 5 and 6","Pinzas: paso 3. Tijeras: para recortar gasa o esparadrapo, pasos 5 y 6"]],["antiseptic",["An antiseptic recommended by your pharmacist or doctor","Antiséptico recomendado por tu farmacéutico o médico"],["Used in: step 4","Se usa en: paso 4"]],["thermo",["A thermometer","Termómetro"],["To check for fever (section 5)","Para comprobar la fiebre (sección 5)"]]]],
["p",["Check expiry dates every six months and store the kit in a cool, dry place out of reach of children.","Revisa las fechas de caducidad cada seis meses y guarda el kit en un lugar fresco, seco y fuera del alcance de los niños."]]]},
{h:["How to treat a minor cut or scrape","Cómo curar un corte o un raspón leve"],b:[
["img","pressure"],["p",["The circled numbers refer to the items in your kit (section 2).","Los números en círculo indican el artículo de tu kit (sección 2)."]],
["cards",["hands","press","rinse","disinf","cover","change","check"],[["<b>Wash your hands</b> with soap and water for at least 20 seconds, and put on gloves if you have them.","<b>Lávate las manos</b> con agua y jabón durante al menos 20 segundos, y ponte guantes si los tienes."],["<b>Stop the bleeding.</b> Press with a clean gauze for 5 to 10 minutes without lifting it to check. If the wound is on an arm or leg, raise the limb.","<b>Detén el sangrado.</b> Presiona con una gasa limpia durante 5 a 10 minutos sin levantarla para mirar. Si es en un brazo o una pierna, elévalo."],["<b>Clean the wound</b> with plenty of running water or saline. Wash the skin around it with soap, but do not scrub inside the wound. Remove visible dirt with clean tweezers.","<b>Limpia la herida</b> con agua corriente o suero abundante. Lava la piel de alrededor con jabón, pero no frotes dentro de la herida. Retira con pinzas limpias la suciedad que se vea."],["<b>Disinfect</b> the skin around the wound with an antiseptic, following the instructions on the package.","<b>Desinfecta</b> la piel alrededor de la herida con un antiséptico, siguiendo las instrucciones del envase."],["<b>Cover the wound</b> with a clean dressing. A covered, slightly moist wound heals better than one left open to the air.","<b>Cubre la herida</b> con un apósito limpio. Una herida cubierta y ligeramente húmeda cicatriza mejor que una al aire."],["<b>Change the dressing</b> once a day, or sooner if it gets wet or dirty.","<b>Cambia el apósito</b> una vez al día, o antes si se moja o se ensucia."],["<b>Check the wound</b> every day for signs of infection.","<b>Observa la herida</b> cada día para detectar signos de infección."]],["1","3","25","6","345","345",""],""],
["h3",["What NOT to do","Lo que NO debes hacer"]],
["dont",[["Do not use alcohol or hydrogen peroxide repeatedly on the wound: they damage tissue and slow healing.","No uses alcohol ni agua oxigenada de forma repetida sobre la herida: dañan los tejidos y retrasan la curación."],["Do not put cotton wool directly on the wound: it leaves fibres behind.","No pongas algodón directamente sobre la herida: deja fibras."],["Do not pick at scabs.","No arranques las costras."],["Do not use home remedies such as toothpaste, sugar, coffee or cobwebs.","No uses remedios caseros como pasta de dientes, azúcar, café o telarañas."]]]]},
{h:["Minor burns","Quemaduras leves"],b:[
["img","burn"],
["cards",["rinse","rings","blister","pad","nocream"],[["Cool the area under running lukewarm or cool water for 10 to 20 minutes. Do not use ice.","Enfría la zona con agua corriente templada o fresca durante 10 a 20 minutos. No uses hielo."],["Remove rings, bracelets or clothing that is not stuck to the skin, before the area swells.","Retira anillos, pulseras o ropa que no esté pegada a la piel, antes de que se hinche."],["Do not pop blisters.","No revientes las ampollas."],["Cover with a non-stick gauze, without pressing.","Cubre con una gasa no adherente, sin apretar."],["Do not apply butter, oil, toothpaste or home creams.","No apliques mantequilla, aceite, pasta de dientes ni cremas caseras."]],null,""],
["note",["Seek professional care if the burn is larger than the palm of your hand, has large blisters, affects a delicate area, or happens to a young child or an older adult.","Consulta a un profesional si la quemadura es más grande que la palma de tu mano, tiene ampollas grandes, afecta a una zona delicada o la sufre un niño pequeño o una persona mayor."]]]},
{h:["Signs of infection: when to see a doctor","Señales de infección: cuándo ir al médico"],b:[
["p",["See a doctor the same day if, after 48 hours, you notice:","Consulta el mismo día si, después de 48 horas, notas:"]],
["img","infection"],
["cards",["s1","s2","s3","s4","s5"],[["Redness that spreads or gets stronger","Enrojecimiento que se extiende o se hace más intenso"],["Warmth, swelling or pain that increases instead of easing","Calor, hinchazón o dolor que aumentan en lugar de disminuir"],["Pus or a bad smell","Pus o mal olor"],["Fever or a general feeling of being unwell","Fiebre o malestar general"],["Red lines spreading from the wound, or swollen glands","Líneas rojas que parten de la herida o ganglios inflamados"]],null,"warn"]]},
{h:["How the body heals","Cómo cicatriza el cuerpo"],b:[
["p",["The body repairs a wound in four phases, and the scar can take months to mature. You can help your body heal:","El cuerpo repara una herida en cuatro fases, y la cicatriz puede tardar meses en madurar. Puedes ayudar a tu cuerpo así:"]],
["img","phases"],
["ul",[["Eat enough protein, fruit and vegetables, and drink water.","Come con suficiente proteína, fruta y verdura, y bebe agua."],["Rest, and avoid smoking, which slows healing.","Descansa y evita el tabaco, que retrasa la cicatrización."],["Protect the scar from the sun for at least a year so it does not darken.","Protege la cicatriz del sol durante al menos un año para que no se oscurezca."]]]]},
{h:["Myths and facts","Mitos y hechos"],b:[
["table",[["Myth","Mito"],["Fact","Hecho"],[[["Wounds heal better in the open air.","Las heridas cicatrizan mejor al aire."],["A clean, covered wound heals better.","Una herida limpia y cubierta cicatriza mejor."]],[["Alcohol disinfects better.","El alcohol desinfecta mejor."],["It damages healthy tissue; saline or soap and water are better.","Daña el tejido sano; mejor suero o agua y jabón."]],[["If it stings, it is working.","Si arde, es que funciona."],["Pain does not mean the antiseptic is more effective.","El dolor no indica que el antiséptico sea más eficaz."]],[["A red scar means infection.","Una cicatriz roja significa infección."],["It is normal for weeks; infection hurts and oozes.","Es normal durante semanas; la infección duele y supura."]]]]]]},
{h:["Vocabulary","Vocabulario"],b:[["vocab",[["wound","herida"],["cut","corte"],["scrape","raspón"],["burn","quemadura"],["blister","ampolla"],["gauze","gasa"],["dressing","apósito"],["bleeding","sangrado"],["infection","infección"],["scar","cicatriz"]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["How long should you press on a bleeding wound?","¿Cuánto tiempo debes presionar una herida que sangra?"],["5 to 10 minutes without lifting the gauze.","5 a 10 minutos sin levantar la gasa."]],[["What do you use to clean a minor wound?","¿Con qué se limpia una herida leve?"],["Plenty of running water or saline.","Con agua corriente o suero abundante."]],[["Should you put ice on a burn?","¿Se debe poner hielo en una quemadura?"],["No: cool it with lukewarm or cool running water.","No: se enfría con agua templada o fresca."]],[["Name two signs of infection.","Nombra dos señales de infección."],["For example: pus and spreading redness.","Por ejemplo: pus y enrojecimiento que se extiende."]],[["What do you do if an object is embedded in a wound?","¿Qué haces si hay un objeto clavado?"],["Do not remove it: keep it still and get help.","No lo retiras: inmovilizas y pides ayuda."]]]]]},
{h:["Learn more","Para saber más"],b:[["p",["Always check official, up-to-date sources, such as the World Health Organization, your national health authority and the Red Cross or Red Crescent. Keep this guide next to your first-aid kit and share it with your family.","Consulta siempre fuentes oficiales y actualizadas, como la Organización Mundial de la Salud, la autoridad sanitaria de tu país y la Cruz Roja o la Media Luna Roja. Guarda esta guía junto a tu botiquín y compártela con tu familia."]]]}
];

hands:{t:["My clean hands","Mis manos limpias"],sub:["BodyWise. An activity guide for children aged 4 to 8, to read and do with an adult.","BodyWise. Guía de actividades para niños de 4 a 8 años, para leer y hacer con un adulto."],disc:KD,G:[
{h:["Why do we wash our hands?","¿Por qué nos lavamos las manos?"],b:[
["img","mascot"],
["p",["Our hands touch many things all day. Some things leave tiny germs on them. Germs are so small that we cannot see them, but they can make us sick.","Nuestras manos tocan muchas cosas durante el día. Algunas dejan gérmenes diminutos. Los gérmenes son tan pequeños que no los podemos ver, pero pueden enfermarnos."]],
["img","germs"],
["p",["Washing with soap and water takes the germs away. Clean hands help us stay healthy, and they help our friends and family stay healthy too.","Lavarnos con agua y jabón se lleva los gérmenes. Las manos limpias nos ayudan a estar sanos, y también a nuestros amigos y a nuestra familia."]]]},
{h:["When do we wash our hands?","¿Cuándo nos lavamos las manos?"],b:[
["cards",["keat","ktoilet","kplay","ksneeze","kpet","kdirty"],[["Before we eat","Antes de comer"],["After using the toilet","Después de ir al baño"],["After playing outside","Después de jugar fuera"],["After coughing, sneezing or blowing our nose","Después de toser, estornudar o sonarnos la nariz"],["After touching an animal","Después de tocar a un animal"],["Whenever our hands look dirty","Cuando las manos se ven sucias"]],null,""]]},
{h:["6 steps to clean hands","6 pasos para unas manos limpias"],b:[
["cards",["ktap","ksoap","kpalms","kfingers","kwet","ktowel"],[["<b>Wet</b> your hands with clean water.","<b>Mójate</b> las manos con agua limpia."],["Put <b>soap</b> on your hands.","Ponte <b>jabón</b> en las manos."],["<b>Rub</b> your palms together, then the back of each hand.","<b>Frota</b> las palmas entre sí y luego el dorso de cada mano."],["Rub <b>between your fingers</b>, around your thumbs and under your nails.","Frota <b>entre los dedos</b>, alrededor de los pulgares y debajo de las uñas."],["<b>Rinse</b> off all the soap with water.","<b>Enjuaga</b> todo el jabón con agua."],["<b>Dry</b> your hands well with a clean towel.","<b>Sécate</b> bien las manos con una toalla limpia."]],null,""],
["img","timer"],
["note",["Keep rubbing for 20 seconds. That is about how long it takes to sing a song twice.","Frota durante 20 segundos. Es más o menos lo que tardas en cantar una canción dos veces."]]]},
{h:["Try it: the pepper experiment","Pruébalo: el experimento de la pimienta"],b:[
["note",["Do this with an adult. You need a bowl of water, ground black pepper and a little liquid soap.","Hazlo con un adulto. Necesitas un bol con agua, pimienta negra molida y un poco de jabón líquido."]],
["img","pepper"],
["ol",[["Sprinkle pepper on the water. Pretend the pepper is germs on our hands.","Espolvorea pimienta sobre el agua. Imagina que la pimienta son los gérmenes de nuestras manos."],["Dip a clean, dry finger in the middle. What happens? The pepper stays.","Moja un dedo limpio y seco en el centro. ¿Qué pasa? La pimienta se queda."],["Now put a little soap on your finger and dip it again.","Ahora ponte un poco de jabón en el dedo y vuelve a mojarlo."],["Look! The pepper runs away from the soap. Soap helps push germs away from our hands.","¡Mira! La pimienta huye del jabón. El jabón ayuda a alejar los gérmenes de nuestras manos."]]]]},
{h:["My handwashing chart","Mi tabla de manos limpias"],b:[["p",["Tap a circle each time you wash your hands. Can you fill the whole week with stars?","Toca un círculo cada vez que te laves las manos. ¿Puedes llenar toda la semana de estrellas?"]],["chart",null]]},
{h:["Note for families and teachers","Nota para familias y profesores"],b:[["ul",[["Wash your hands together with the child so they can copy you.","Lávate las manos junto al niño para que te imite."],["Make it a routine: before meals, after the toilet and when coming home.","Hazlo rutina: antes de comer, después del baño y al llegar a casa."],["Use a step stool, and keep the soap and towel within reach.","Usa un taburete y deja el jabón y la toalla al alcance."],["Choose a mild soap for sensitive skin and dry the hands well.","Elige un jabón suave si la piel es sensible y seca bien las manos."],["If there is no water, an adult can help with an alcohol-based hand gel (at least 60% alcohol). Keep it out of reach of young children.","Si no hay agua, un adulto puede ayudar con un gel de manos con alcohol (al menos 60 %). Manténlo fuera del alcance de los niños pequeños."],["Ask a doctor if a child's hands become very dry, cracked or sore.","Consulta con un médico si las manos del niño se resecan mucho, se agrietan o duelen."]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["How long do we rub our hands with soap?","¿Cuánto tiempo frotamos las manos con jabón?"],["20 seconds, about a song sung twice.","20 segundos, como una canción cantada dos veces."]],[["Can we see germs with our eyes?","¿Podemos ver los gérmenes con los ojos?"],["No, they are too small.","No, son demasiado pequeños."]],[["Should we wash our hands before eating?","¿Debemos lavarnos las manos antes de comer?"],["Yes!","¡Sí!"]],[["Name one place we clean besides our palms.","Nombra un lugar que limpiamos además de las palmas."],["Between the fingers, the backs of the hands, the thumbs or under the nails.","Entre los dedos, el dorso de las manos, los pulgares o debajo de las uñas."]]]]]},

const KDG=["This guide is educational. Talk to an adult if you feel sick or your tummy hurts.","Esta guía es educativa. Habla con un adulto si te sientes mal o te duele la barriga."];

GUIDES.digkids={t:["Digestive system","Aparato digestivo"],sub:["BodyWise. A short guide for children aged 5 to 9, to read with an adult.","BodyWise. Guía breve para niños de 5 a 9 años, para leer con un adulto."],disc:KDG,G:[
{h:["A trip through your tummy","Un viaje por tu barriga"],b:[
["p",["When we eat, the food goes on a long trip inside our body. It travels through a long tube called the digestive system. Our body breaks the food into tiny pieces and keeps the good things, called nutrients, that give us energy to play, grow and learn.","Cuando comemos, la comida hace un viaje largo dentro de nuestro cuerpo. Viaja por un tubo largo llamado aparato digestivo. Nuestro cuerpo rompe la comida en trocitos y se queda con las cosas buenas, llamadas nutrientes, que nos dan energía para jugar, crecer y aprender."]],
["img","journey"]]},
{h:["The 5 stops of the food trip","Las 5 paradas del viaje de la comida"],b:[
["cards",["c1","c2","c3","c4","c5"],[["<b>Mouth.</b> Our teeth cut and crush the food, and saliva makes it soft and wet.","<b>Boca.</b> Los dientes cortan y trituran la comida y la saliva la ablanda y la humedece."],["<b>Throat.</b> We swallow, and the food slides down a tube like a slide.","<b>Garganta.</b> Tragamos y la comida resbala por un tubo como un tobogán."],["<b>Stomach.</b> A stretchy bag that squeezes and mixes the food into a soft soup.","<b>Estómago.</b> Una bolsa elástica que aprieta y mezcla la comida hasta hacer una sopa blanda."],["<b>Small intestine.</b> A very long tube, about 6 metres. Here our body takes the good things from the food.","<b>Intestino delgado.</b> Un tubo larguísimo, de unos 6 metros. Aquí el cuerpo toma las cosas buenas de la comida."],["<b>Large intestine.</b> It takes out the water. What the body does not need leaves as poo when we go to the toilet.","<b>Intestino grueso.</b> Saca el agua. Lo que el cuerpo no necesita sale como caca cuando vamos al baño."]],null,""]]},
{h:["Try it: the sweet cracker","Pruébalo: la galleta dulce"],b:[
["note",["Do this with an adult. An adult checks that the cracker is safe for you, for example that you have no food allergies.","Hazlo con un adulto. Un adulto comprueba que la galleta es segura para ti, por ejemplo que no tienes alergias alimentarias."]],
["cards",["cracker","c1","star"],[["Take a small plain cracker.","Toma una galleta salada sencilla y pequeña."],["Chew it slowly for one minute before you swallow. Does the taste change?","Mastícala despacio durante un minuto antes de tragar. ¿Cambia el sabor?"],["It starts to taste a little sweet! Your saliva begins to turn the cracker's starch into sugar.","¡Empieza a saber un poco dulce! Tu saliva empieza a convertir el almidón de la galleta en azúcar."]],null,""]]},
{h:["Be kind to your tummy","Cuida tu barriga"],b:[
["cards",["glass","apple","c1","toilet","wet"],[["Drink water during the day.","Bebe agua durante el día."],["Eat fruits and vegetables of many colours.","Come frutas y verduras de muchos colores."],["Chew slowly and eat sitting down.","Mastica despacio y come sentado."],["Go to the toilet when your body asks you to.","Ve al baño cuando tu cuerpo te lo pida."],["Wash your hands before you eat.","Lávate las manos antes de comer."]],null,""]]},
{h:["Note for families and teachers","Nota para familias y profesores"],b:[["ul",[["Tummy aches are common in children. Ask a doctor if the pain is strong, keeps coming back or lasts more than a day.","Los dolores de barriga son frecuentes en los niños. Consulta con un médico si el dolor es fuerte, vuelve una y otra vez o dura más de un día."],["See a doctor soon if there is vomiting that does not stop, blood in the stool, fever, or the child cannot drink or is very sleepy.","Acude pronto al médico si hay vómitos que no paran, sangre en las heces, fiebre, o si el niño no puede beber o está muy dormido."],["Signs of a food allergy, such as hives, swelling of the lips or trouble breathing, are an emergency: call your local emergency number.","Los signos de una alergia alimentaria, como ronchas, hinchazón de labios o dificultad para respirar, son una urgencia: llama al número de emergencias de tu país."],["For hard stools, fibre from fruit, vegetables and whole grains, water, and a calm routine after meals can help. Ask a doctor if it lasts.","Si las heces son duras, ayudan la fibra de frutas, verduras y cereales integrales, el agua y una rutina tranquila después de las comidas. Consulta con un médico si dura."],["Do not force children to eat. Offer a variety of foods and let them explore.","No obligues a los niños a comer. Ofrece alimentos variados y deja que los exploren."]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["What is the first stop of the food trip?","¿Cuál es la primera parada del viaje de la comida?"],["The mouth.","La boca."]],[["Which part is a stretchy bag that mixes the food?","¿Qué parte es una bolsa elástica que mezcla la comida?"],["The stomach.","El estómago."]],[["Where does our body take the good things from the food?","¿Dónde toma el cuerpo las cosas buenas de la comida?"],["In the small intestine.","En el intestino delgado."]],[["Name one way to be kind to your tummy.","Nombra una forma de cuidar tu barriga."],["For example: drink water, eat fruits and vegetables, chew slowly or wash your hands.","Por ejemplo: beber agua, comer frutas y verduras, masticar despacio o lavarte las manos."]]]]]},
{h:["Vocabulary","Vocabulario"],b:[["vocab",[["mouth","boca"],["teeth","dientes"],["saliva","saliva"],["stomach","estómago"],["intestine","intestino"],["food","comida"],["water","agua"],["to swallow","tragar"],["tummy","barriga"],["toilet","baño"]]]]},
{h:["You know how your tummy works!","¡Ya sabes cómo funciona tu barriga!"],b:[["note",["Draw your favourite healthy food here and write your name: ______________","Dibuja aquí tu comida sana favorita y escribe tu nombre: ______________"]]]}
]};
GUIDES.digteens={t:["Digestive system in depth","Aparato digestivo a fondo"],sub:["BodyWise. A complete guide for teens aged 12 to 17.","BodyWise. Guía completa para adolescentes de 12 a 17 años."],disc:DISC,G:[
{h:["Your digestive system at a glance","Tu aparato digestivo de un vistazo"],b:[
["p",["The digestive system is a tube of about 9 metres that runs from the mouth to the anus, helped by organs that make digestive juices. It does four jobs: taking food in, breaking it down (mechanically and chemically), absorbing nutrients, and getting rid of what the body does not need.","El aparato digestivo es un tubo de unos 9 metros que va de la boca al ano, con la ayuda de órganos que fabrican jugos digestivos. Hace cuatro tareas: introducir el alimento, descomponerlo (de forma mecánica y química), absorber los nutrientes y eliminar lo que el cuerpo no necesita."]],
["img","anat"],
["cards",["st1","st2","liver","gall","st3","panc","st4","st5","rect"],[["<b>Mouth and salivary glands.</b> Teeth chew food and saliva starts to digest starch.","<b>Boca y glándulas salivales.</b> Los dientes mastican y la saliva empieza a digerir el almidón."],["<b>Esophagus.</b> A muscular tube that pushes food to the stomach in waves (peristalsis).","<b>Esófago.</b> Un tubo muscular que empuja el alimento al estómago con ondas (peristaltismo)."],["<b>Liver.</b> Makes bile, processes nutrients and filters the blood.","<b>Hígado.</b> Fabrica la bilis, procesa los nutrientes y filtra la sangre."],["<b>Gallbladder.</b> Stores bile and releases it when we eat fat.","<b>Vesícula biliar.</b> Guarda la bilis y la libera cuando comemos grasa."],["<b>Stomach.</b> Churns food with acid and the enzyme pepsin for about 2 to 4 hours.","<b>Estómago.</b> Mezcla el alimento con ácido y la enzima pepsina durante unas 2 a 4 horas."],["<b>Pancreas.</b> Sends digestive enzymes and bicarbonate into the small intestine.","<b>Páncreas.</b> Envía enzimas digestivas y bicarbonato al intestino delgado."],["<b>Small intestine.</b> Around 6 metres long, where most digestion and absorption happen.","<b>Intestino delgado.</b> Mide unos 6 metros y es donde ocurre la mayor parte de la digestión y la absorción."],["<b>Large intestine.</b> Absorbs water and salts, hosts gut bacteria and forms stool.","<b>Intestino grueso.</b> Absorbe agua y sales, alberga bacterias intestinales y forma las heces."],["<b>Rectum and anus.</b> Store stool until we go to the toilet.","<b>Recto y ano.</b> Guardan las heces hasta que vamos al baño."]],null,""]]},
{h:["The journey of a meal","El viaje de una comida"],b:[
["table",[["Where, and about how long","Dónde y cuánto tiempo, aproximadamente"],["What happens","Qué ocurre"],[[["Mouth: seconds to minutes","Boca: de segundos a minutos"],["Chewing and saliva; amylase starts breaking starch into sugars.","Masticación y saliva; la amilasa empieza a romper el almidón en azúcares."]],[["Esophagus: 5 to 10 seconds","Esófago: de 5 a 10 segundos"],["Swallowing; muscle waves push the food down.","Deglución; ondas musculares empujan el alimento hacia abajo."]],[["Stomach: 2 to 4 hours","Estómago: de 2 a 4 horas"],["Acid and pepsin start digesting protein; the food becomes a thick liquid.","El ácido y la pepsina empiezan a digerir las proteínas; el alimento se vuelve un líquido espeso."]],[["Small intestine: 3 to 6 hours","Intestino delgado: de 3 a 6 horas"],["Bile and pancreatic enzymes finish digestion; nutrients pass into the blood.","La bilis y las enzimas del páncreas terminan la digestión; los nutrientes pasan a la sangre."]],[["Large intestine: 12 to 48 hours","Intestino grueso: de 12 a 48 horas"],["Water is absorbed; bacteria work on fibre; stool forms.","Se absorbe el agua; las bacterias trabajan sobre la fibra; se forman las heces."]]]]],
["note",["These times are approximate and change from person to person. From meal to toilet it often takes 1 to 3 days.","Estos tiempos son aproximados y cambian de una persona a otra. Desde la comida hasta el baño suele tardar de 1 a 3 días."]]]},
{h:["How nutrients are absorbed","Cómo se absorben los nutrientes"],b:[
["p",["The inner wall of the small intestine is covered in millions of tiny folds called villi. They make the surface for absorption very large. Sugars and amino acids pass into tiny blood vessels, and fats pass into a vessel called the lacteal.","La pared interior del intestino delgado está cubierta por millones de pliegues diminutos llamados vellosidades. Hacen que la superficie de absorción sea enorme. Los azúcares y los aminoácidos pasan a pequeños vasos sanguíneos, y las grasas pasan a un vaso llamado vaso quilífero (linfático)."]],
["pic","absorb"],
["cards",["st4","cells","lumen","cap"],[["<b>Maximizing the surface.</b> The wall of the small intestine has circular folds and millions of villi that greatly increase the absorption surface.","<b>Maximizar la superficie.</b> La pared del intestino delgado tiene pliegues circulares y millones de vellosidades que aumentan mucho la superficie de absorción."],["<b>The microscopic laboratory.</b> The cells of each villus have tiny hairs, the microvilli, that form the brush border. Some substances cross by passive transport, such as diffusion.","<b>El laboratorio microscópico.</b> Las células de cada vellosidad tienen pelitos diminutos, las microvellosidades, que forman el borde en cepillo. Algunas sustancias pasan por transporte pasivo, como la difusión."],["<b>Selective transport.</b> Other substances, such as glucose, need active transport: proteins in the membrane capture them and the process uses energy (ATP).","<b>Transporte selectivo.</b> Otras sustancias, como la glucosa, necesitan transporte activo: proteínas de la membrana las captan y el proceso gasta energía (ATP)."],["<b>Distribution network.</b> Sugars and amino acids enter the capillaries and travel through the portal vein to the liver. Fats enter the lacteal (lymphatic vessel) and reach the general circulation later.","<b>Red de distribución.</b> Los azúcares y los aminoácidos pasan a los capilares y van por la vena porta al hígado. Las grasas pasan al conducto quilífero (linfático) y llegan después a la circulación general."]],null,""]]},
{h:["The chemistry of digestion","La química de la digestión"],b:[
["table",[["Enzyme or fluid","Enzima o líquido"],["What it does","Qué hace"],[[["Amylase (saliva, pancreas)","Amilasa (saliva, páncreas)"],["Breaks starch into sugars.","Rompe el almidón en azúcares."]],[["Stomach acid","Ácido del estómago"],["Helps pepsin work and kills many germs.","Ayuda a la pepsina y mata muchos gérmenes."]],[["Pepsin (stomach)","Pepsina (estómago)"],["Starts breaking proteins into smaller pieces.","Empieza a romper las proteínas en trozos más pequeños."]],[["Bile (liver, stored in the gallbladder)","Bilis (hígado, guardada en la vesícula)"],["Breaks fat into tiny droplets so it can be digested.","Divide la grasa en gotitas diminutas para poder digerirla."]],[["Lipase (pancreas)","Lipasa (páncreas)"],["Digests fats into fatty acids.","Digiere las grasas en ácidos grasos."]],[["Proteases (pancreas)","Proteasas (páncreas)"],["Break proteins into amino acids.","Rompen las proteínas en aminoácidos."]],[["Bicarbonate (pancreas)","Bicarbonato (páncreas)"],["Neutralises the stomach acid in the small intestine.","Neutraliza el ácido del estómago en el intestino delgado."]]]]],
["note",["Try it: chew a plain cracker for two minutes without swallowing. It starts to taste sweet as amylase turns starch into sugar. Check first that you have no food allergies.","Pruébalo: mastica una galleta salada sencilla durante dos minutos sin tragar. Empieza a saber dulce porque la amilasa convierte el almidón en azúcar. Comprueba antes que no tienes alergias alimentarias."]]]},
{h:["Fibre, water and your gut bacteria","Fibra, agua y bacterias intestinales"],b:[["ul",[["Carbohydrates become sugars, proteins become amino acids and fats become fatty acids. Vitamins and minerals are absorbed too.","Los hidratos de carbono se convierten en azúcares, las proteínas en aminoácidos y las grasas en ácidos grasos. También se absorben las vitaminas y los minerales."],["Fibre is not digested. It keeps stool soft and feeds helpful gut bacteria.","La fibra no se digiere. Mantiene blandas las heces y alimenta a las bacterias intestinales beneficiosas."],["Trillions of bacteria live in the large intestine. Many are helpful: they break down fibre, make some vitamins and help train the immune system.","Billones de bacterias viven en el intestino grueso. Muchas son beneficiosas: descomponen la fibra, fabrican algunas vitaminas y ayudan a entrenar el sistema inmunitario."],["Antibiotics can upset these bacteria, so take them only when a doctor prescribes them.","Los antibióticos pueden alterar estas bacterias, así que tómalos solo cuando te los recete un médico."]]]]},
{h:["Common problems","Problemas frecuentes"],b:[
["cards",["w9","toilet","wet","tri","st3"],[["<b>Heartburn.</b> A burning feeling in the chest when stomach acid rises into the esophagus. Smaller meals and not lying down right after eating can help. See a doctor if it happens often or swallowing is difficult.","<b>Ardor de estómago.</b> Sensación de quemazón en el pecho cuando el ácido del estómago sube al esófago. Ayudan las comidas más pequeñas y no acostarse justo después de comer. Consulta con un médico si ocurre a menudo o te cuesta tragar."],["<b>Constipation.</b> Hard stools or going less often than usual. Fibre, water, daily movement and not ignoring the urge to go help. See a doctor if it lasts weeks, hurts or there is blood.","<b>Estreñimiento.</b> Heces duras o ir menos veces de lo normal. Ayudan la fibra, el agua, el movimiento diario y no ignorar las ganas de ir. Consulta con un médico si dura semanas, duele o hay sangre."],["<b>Diarrhoea and stomach bugs.</b> Often caused by an infection. The main risk is losing too much water, so drink small sips often and wash your hands well. See a doctor the same day if there is blood, high fever, severe pain, signs of dehydration or it lasts more than a few days.","<b>Diarrea y gastroenteritis.</b> Suele deberse a una infección. El riesgo principal es perder demasiada agua, así que bebe sorbos pequeños a menudo y lávate bien las manos. Acude al médico el mismo día si hay sangre, fiebre alta, dolor intenso, signos de deshidratación o dura más de unos días."],["<b>Food allergy or intolerance.</b> An allergy involves the immune system and can cause hives, swelling or trouble breathing: that is an emergency. An intolerance, for example to lactose, causes gas, bloating or diarrhoea. Ask a doctor for tests and do not cut out food groups on your own.","<b>Alergia o intolerancia alimentaria.</b> La alergia implica al sistema inmunitario y puede causar ronchas, hinchazón o dificultad para respirar: es una urgencia. La intolerancia, por ejemplo a la lactosa, causa gases, hinchazón o diarrea. Pide pruebas a un médico y no elimines grupos de alimentos por tu cuenta."],["<b>Stress and tummy ache.</b> Worry can cause stomach aches, nausea or changes in how often we go. Rest, movement and talking to someone you trust help. If it keeps happening, ask a doctor.","<b>Estrés y dolor de barriga.</b> La preocupación puede causar dolor de estómago, náuseas o cambios en cuántas veces vamos al baño. Ayudan el descanso, el movimiento y hablar con alguien de confianza. Si sigue ocurriendo, consulta con un médico."]],null,""]]},
{h:["Warning signs: get help","Señales de alerta: pide ayuda"],b:[
["p",["Get urgent medical help for sudden severe belly pain, vomiting blood, black or bloody stools, or signs of a severe allergic reaction. See a doctor soon for any of these:","Pide ayuda médica urgente si hay un dolor de barriga intenso y repentino, vómitos con sangre, heces negras o con sangre, o signos de una reacción alérgica grave. Consulta pronto con un médico si notas alguna de estas señales:"]],
["cards",["st3","w1","st2","w8","yellow"],[["Belly pain that is strong or does not go away","Dolor de barriga fuerte o que no se va"],["Blood in the vomit or in the stool","Sangre en el vómito o en las heces"],["Trouble swallowing, or food that gets stuck","Dificultad para tragar o comida que se atasca"],["Vomiting that will not stop, or not being able to keep liquids down","Vómitos que no paran o no poder retener líquidos"],["Yellow skin or eyes, or losing weight without trying","Piel u ojos amarillos, o perder peso sin querer"]],null,"warn"]]},
{h:["Healthy habits for your gut","Hábitos saludables para tu intestino"],b:[["ul",[["Eat a variety of foods, with plenty of fruit, vegetables, legumes and whole grains.","Come alimentos variados, con muchas frutas, verduras, legumbres y cereales integrales."],["Drink water, and eat regular meals slowly and without rushing.","Bebe agua y haz comidas regulares, despacio y sin prisas."],["Move every day and sleep enough: both help digestion.","Muévete cada día y duerme lo suficiente: ambas cosas ayudan a la digestión."],["Wash your hands and keep food safe to avoid stomach infections.","Lávate las manos y conserva bien los alimentos para evitar infecciones de estómago."],["Do not smoke or vape.","No fumes ni vapees."]]],["note",["If you feel worried about food, your weight or your body, talk to a trusted adult or a doctor.","Si te preocupa la comida, tu peso o tu cuerpo, habla con un adulto de confianza o con un médico."]]]},
{h:["Myths and facts","Mitos y hechos"],b:[["table",[["Myth","Mito"],["Fact","Hecho"],[[["Food stays in your stomach for days.","La comida se queda días en el estómago."],["It usually stays 2 to 4 hours; the whole journey takes 1 to 3 days.","Suele quedarse de 2 a 4 horas; el viaje completo tarda de 1 a 3 días."]],[["Stomach acid is bad for you.","El ácido del estómago es malo."],["You need it to digest protein and to kill germs.","Lo necesitas para digerir las proteínas y matar gérmenes."]],[["You need a detox to clean your gut.","Necesitas una desintoxicación para limpiar el intestino."],["Your liver, kidneys and intestines already do that work.","El hígado, los riñones y los intestinos ya hacen ese trabajo."]],[["All bacteria are bad.","Todas las bacterias son malas."],["Many gut bacteria are helpful.","Muchas bacterias intestinales son beneficiosas."]],[["Swallowed chewing gum stays inside for seven years.","El chicle tragado se queda siete años dentro."],["It is not digested, but it usually passes out within days.","No se digiere, pero suele salir en pocos días."]]]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["Where does most absorption of nutrients happen?","¿Dónde se absorbe la mayoría de los nutrientes?"],["In the small intestine, through the villi.","En el intestino delgado, a través de las vellosidades."]],[["What does bile do?","¿Qué hace la bilis?"],["It breaks fat into tiny droplets.","Divide la grasa en gotitas diminutas."]],[["Why is fibre important?","¿Por qué es importante la fibra?"],["It keeps stool soft and feeds helpful gut bacteria.","Mantiene blandas las heces y alimenta a las bacterias beneficiosas."]],[["What is the main risk of diarrhoea?","¿Cuál es el principal riesgo de la diarrea?"],["Losing too much water (dehydration).","Perder demasiada agua (deshidratación)."]],[["Name two warning signs that need a doctor.","Nombra dos señales de alerta que necesitan un médico."],["For example: blood in the stool, strong belly pain or trouble swallowing.","Por ejemplo: sangre en las heces, dolor de barriga fuerte o dificultad para tragar."]]]]]},

GUIDES.respteens={t:["Respiratory system in depth","Aparato respiratorio a fondo"],sub:["BodyWise. A complete guide for teens aged 12 to 17.","BodyWise. Guía completa para adolescentes de 12 a 17 años."],disc:DISC,pic:"respteens",G:[
{h:["Your respiratory system at a glance","Tu aparato respiratorio de un vistazo"],b:[
["p",["The respiratory system brings oxygen into the body and removes carbon dioxide. Air travels through a system of tubes that branch like a tree and ends in millions of tiny air sacs, the alveoli, inside the lungs.","El aparato respiratorio introduce oxígeno en el cuerpo y elimina el dióxido de carbono. El aire viaja por un sistema de tubos que se ramifican como un árbol y termina en millones de pequeños sacos de aire, los alvéolos, dentro de los pulmones."]],
["cards",["nose","st1","pharx","larynx","trach","bronchi","bronchioles","lungs","diaph"],[["<b>Nasal passages.</b> The main entrance for air. They filter, warm and humidify it.","<b>Fosas nasales.</b> La entrada principal del aire. Lo filtran, lo calientan y lo humedecen."],["<b>Mouth.</b> An alternative entrance. More air flows in, but it is filtered and warmed less.","<b>Boca.</b> Una entrada alternativa. Entra más aire, pero se filtra y se calienta menos."],["<b>Pharynx.</b> A crossroads for air and food. It contains the tonsils.","<b>Faringe.</b> Un cruce de caminos para el aire y la comida. Contiene las amígdalas."],["<b>Larynx.</b> The voice box, with the vocal cords. The epiglottis closes it when we swallow.","<b>Laringe.</b> La caja de la voz, con las cuerdas vocales. La epiglotis la cierra cuando tragamos."],["<b>Trachea.</b> A tube held open by rings of cartilage that carries air to the lungs.","<b>Tráquea.</b> Un tubo que se mantiene abierto con anillos de cartílago y lleva el aire a los pulmones."],["<b>Bronchi.</b> Two branches of the trachea, one for each lung.","<b>Bronquios.</b> Dos ramas de la tráquea, una para cada pulmón."],["<b>Bronchioles.</b> Thinner and thinner branches that carry the air towards the alveoli.","<b>Bronquiolos.</b> Ramas cada vez más finas que llevan el aire hacia los alvéolos."],["<b>Lungs.</b> Spongy organs with millions of alveoli, where gas exchange happens.","<b>Pulmones.</b> Órganos esponjosos con millones de alvéolos, donde ocurre el intercambio de gases."],["<b>Diaphragm.</b> The main breathing muscle. When it contracts, the chest expands and we inhale.","<b>Diafragma.</b> El principal músculo de la respiración. Al contraerse, el tórax se expande y inhalamos."]],null,""]]},
{h:["The journey of the air","El viaje del aire"],b:[
["ol",[["Air enters through the nose or the mouth.","El aire entra por la nariz o por la boca."],["It passes through the pharynx and the larynx.","Pasa por la faringe y la laringe."],["It goes down the trachea.","Baja por la tráquea."],["The trachea divides into two bronchi, one for each lung.","La tráquea se divide en dos bronquios, uno para cada pulmón."],["The bronchi branch into bronchioles.","Los bronquios se ramifican en bronquiolos."],["The bronchioles end in the alveoli, where oxygen enters the blood.","Los bronquiolos terminan en los alvéolos, donde el oxígeno pasa a la sangre."]]],
["table",[["Movement","Movimiento"],["What happens","Qué ocurre"],[[["Inhaling","Inhalar"],["The diaphragm contracts and moves down, the ribs lift, the chest expands and air flows in.","El diafragma se contrae y baja, las costillas se elevan, el tórax se expande y entra el aire."]],[["Exhaling","Exhalar"],["The diaphragm relaxes and moves up, the lungs recoil and air flows out.","El diafragma se relaja y sube, los pulmones se retraen y el aire sale."]],[["During exercise","Durante el ejercicio"],["Muscles between the ribs, in the neck and in the abdomen help to move more air.","Los músculos entre las costillas, del cuello y del abdomen ayudan a mover más aire."]]]]]]},
{h:["Gas exchange in the alveoli","Intercambio de gases en los alvéolos"],b:[
["p",["Each lung has hundreds of millions of alveoli. Their walls are only one cell thin and are wrapped in tiny blood vessels called capillaries. That is where the exchange of gases happens.","Cada pulmón tiene cientos de millones de alvéolos. Sus paredes tienen el grosor de una sola célula y están rodeadas de vasos sanguíneos diminutos llamados capilares. Ahí ocurre el intercambio de gases."]],
["cards",["alveoli","o2","co2","cap"],[["<b>Air arrives.</b> Fresh air fills the alveoli.","<b>Llega el aire.</b> El aire fresco llena los alvéolos."],["<b>Oxygen goes in.</b> Oxygen crosses the thin wall and enters the blood.","<b>Entra el oxígeno.</b> El oxígeno atraviesa la pared fina y pasa a la sangre."],["<b>Carbon dioxide comes out.</b> Carbon dioxide leaves the blood and enters the alveoli, and we breathe it out.","<b>Sale el dióxido de carbono.</b> El dióxido de carbono sale de la sangre, pasa a los alvéolos y lo expulsamos al exhalar."],["<b>The blood travels.</b> The blood carries the oxygen to the whole body.","<b>La sangre viaja.</b> La sangre lleva el oxígeno a todo el cuerpo."]],null,""]]},
{h:["How breathing is controlled","Cómo se controla la respiración"],b:[["ul",[["Breathing is controlled automatically by the brainstem, so we breathe even when we sleep.","La respiración la controla de forma automática el tronco del encéfalo, por eso respiramos incluso mientras dormimos."],["Sensors detect how much carbon dioxide there is in the blood. When it rises, for example during exercise, we breathe faster and deeper.","Unos sensores detectan cuánto dióxido de carbono hay en la sangre. Cuando sube, por ejemplo al hacer ejercicio, respiramos más rápido y más profundo."],["We can also control our breathing on purpose, for example when we sing, talk or hold our breath for a moment, but the body takes over when it needs air.","También podemos controlar la respiración a propósito, por ejemplo al cantar, hablar o contener el aire un momento, pero el cuerpo toma el control cuando necesita aire."],["At rest, most people breathe about 12 to 20 times a minute.","En reposo, la mayoría de las personas respiran unas 12 a 20 veces por minuto."]]],
["note",["Try it: sit calmly and count your breaths for one minute. Then do one minute of brisk walking and count again. What changes? Only do it if you feel well, and stop if you feel dizzy or short of breath.","Pruébalo: siéntate con calma y cuenta tus respiraciones durante un minuto. Después camina rápido un minuto y vuelve a contar. ¿Qué cambia? Hazlo solo si te encuentras bien y para si notas mareo o falta de aire."]]]},
{h:["Keep your lungs healthy","Cuida tus pulmones"],b:[["ul",[["Do not smoke or vape, and stay away from smoke. Vapour from e-cigarettes is not just water: it contains chemicals that can harm the lungs.","No fumes ni vapees, y aléjate del humo. El vapor de los cigarrillos electrónicos no es solo agua: contiene sustancias que pueden dañar los pulmones."],["Move every day. Exercise strengthens the breathing muscles and improves fitness.","Muévete cada día. El ejercicio fortalece los músculos de la respiración y mejora la condición física."],["Wash your hands often and get the vaccines recommended in your country.","Lávate las manos a menudo y ponte las vacunas recomendadas en tu país."],["Ventilate rooms and avoid places with a lot of smoke or dust.","Ventila las habitaciones y evita los lugares con mucho humo o polvo."],["If a doctor has prescribed an inhaler or a treatment, use it as instructed.","Si un médico te ha recetado un inhalador o un tratamiento, úsalo como te han indicado."]]]]},
{h:["Common problems","Problemas frecuentes"],b:[
["cards",["s4","bronchioles","bronchi","lungs","tri"],[["<b>Cold and flu.</b> Viral infections of the nose and throat. Rest, fluids and washing hands help. See a doctor if the fever is high or lasts more than a few days, or if breathing is difficult.","<b>Resfriado y gripe.</b> Infecciones víricas de la nariz y la garganta. Ayudan el descanso, los líquidos y lavarse las manos. Consulta con un médico si la fiebre es alta o dura más de unos días, o si cuesta respirar."],["<b>Asthma.</b> The airways become narrow and inflamed, causing wheezing, cough and shortness of breath. Triggers include allergens, cold air, exercise and smoke. It is treated with medication prescribed by a doctor.","<b>Asma.</b> Las vías respiratorias se estrechan y se inflaman, y causan silbidos en el pecho, tos y falta de aire. Los desencadenantes son los alérgenos, el aire frío, el ejercicio y el humo. Se trata con la medicación que recete un médico."],["<b>Bronchitis.</b> Inflammation of the bronchi, often after a viral infection, with cough and mucus. See a doctor if it lasts for weeks or there is fever or trouble breathing.","<b>Bronquitis.</b> Inflamación de los bronquios, a menudo tras una infección vírica, con tos y mucosidad. Consulta con un médico si dura semanas o hay fiebre o dificultad para respirar."],["<b>Pneumonia.</b> An infection of the lungs that fills the alveoli with fluid. It can cause fever, cough and fast breathing, and it needs medical assessment.","<b>Neumonía.</b> Una infección de los pulmones que llena de líquido los alvéolos. Puede causar fiebre, tos y respiración rápida, y necesita valoración médica."],["<b>Hay fever.</b> Sneezing, a runny nose and itchy eyes caused by allergens such as pollen. A doctor or pharmacist can advise on treatment.","<b>Rinitis alérgica.</b> Estornudos, moqueo y picor de ojos causados por alérgenos como el polen. Un médico o un farmacéutico pueden aconsejar el tratamiento."]],null,""]]},
{h:["Warning signs: get help","Señales de alerta: pide ayuda"],b:[
["p",["Get urgent medical help, and call your local emergency number if needed, if any of these happen:","Pide ayuda médica urgente, y llama al número de emergencias de tu país si hace falta, si ocurre alguna de estas situaciones:"]],
["cards",["lungs","heart","w8","tri"],[["Struggling to breathe, or not being able to speak in full sentences","Dificultad para respirar, o no poder hablar con frases completas"],["Chest pain or pressure","Dolor u opresión en el pecho"],["Blue or grey lips or face, or being very sleepy or confused","Labios o cara azulados o grisáceos, o mucho sueño o confusión"],["Wheezing that does not improve with the reliever inhaler a doctor prescribed","Silbidos en el pecho que no mejoran con el inhalador de rescate que te recetó un médico"]],null,"warn"]]},
{h:["Myths and facts","Mitos y hechos"],b:[["table",[["Myth","Mito"],["Fact","Hecho"],[[["Breathing through the mouth is as good as through the nose.","Respirar por la boca es igual de bueno que por la nariz."],["The nose filters, warms and humidifies the air. The mouth is fine during hard exercise, but it does none of this as well.","La nariz filtra, calienta y humedece el aire. La boca sirve durante el ejercicio intenso, pero hace todo eso peor."]],[["Vaping is just harmless water vapour.","Vapear es solo vapor de agua inofensivo."],["The aerosol contains chemicals that can irritate and harm the lungs.","El aerosol contiene sustancias que pueden irritar y dañar los pulmones."]],[["Breathing exercises can cure asthma.","Los ejercicios de respiración curan el asma."],["They can help you relax, but they do not replace the treatment prescribed by a doctor.","Pueden ayudarte a relajarte, pero no sustituyen el tratamiento que recete un médico."]],[["We only use a small part of our lungs.","Solo usamos una pequeña parte de los pulmones."],["We use all of them. At rest we just do not use their full capacity.","Los usamos todos. En reposo simplemente no usamos toda su capacidad."]]]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["What is the main muscle of breathing?","¿Cuál es el principal músculo de la respiración?"],["The diaphragm.","El diafragma."]],[["Where does gas exchange take place?","¿Dónde ocurre el intercambio de gases?"],["In the alveoli.","En los alvéolos."]],[["Which gas goes from the alveoli into the blood?","¿Qué gas pasa de los alvéolos a la sangre?"],["Oxygen. Carbon dioxide goes the other way.","El oxígeno. El dióxido de carbono va en sentido contrario."]],[["Why is the nose better than the mouth for breathing in?","¿Por qué es mejor la nariz que la boca para inhalar?"],["It filters, warms and humidifies the air.","Filtra, calienta y humedece el aire."]],[["Name one warning sign that needs urgent help.","Nombra una señal de alerta que necesita ayuda urgente."],["For example: trouble breathing, chest pain or blue lips.","Por ejemplo: dificultad para respirar, dolor en el pecho o labios azulados."]]]]]},
{h:["Vocabulary","Vocabulario"],b:[["vocab",[["nose","nariz"],["mouth","boca"],["pharynx","faringe"],["larynx","laringe"],["trachea","tráquea"],["bronchus (bronchi)","bronquio (bronquios)"],["bronchiole","bronquiolo"],["lung","pulmón"],["alveolus (alveoli)","alvéolo (alvéolos)"],["diaphragm","diafragma"],["to inhale","inhalar"],["to exhale","exhalar"],["oxygen","oxígeno"],["carbon dioxide","dióxido de carbono"],["to breathe","respirar"]]]]},
{h:["Learn more","Para saber más"],b:[["p",["Always check official, up-to-date sources, such as the World Health Organization or your national health authority. Share this guide with your family and ask a health professional about anything that worries you.","Consulta siempre fuentes oficiales y actualizadas, como la Organización Mundial de la Salud o la autoridad sanitaria de tu país. Comparte esta guía con tu familia y pregunta a un profesional sanitario cualquier cosa que te preocupe."]]]}
]};

GUIDES.respkids={t:["Respiratory system","Aparato respiratorio"],sub:["BodyWise. A short guide for children aged 5 to 9, to read with an adult.","BodyWise. Guía breve para niños de 5 a 9 años, para leer con un adulto."],disc:["This guide is educational. Talk to an adult if you feel sick or it is hard to breathe.","Esta guía es educativa. Habla con un adulto si te sientes mal o te cuesta respirar."],pic:"respkids",G:[
{h:["How do we breathe?","¿Cómo respiramos?"],b:[
["p",["We breathe all day and all night, even when we are asleep. Breathing brings the oxygen our body needs to play, grow and think, and takes out the carbon dioxide we do not need.","Respiramos todo el día y toda la noche, incluso mientras dormimos. Al respirar entra el oxígeno que nuestro cuerpo necesita para jugar, crecer y pensar, y sale el dióxido de carbono que no necesitamos."]]]},
{h:["The 4 steps of a breath","Los 4 pasos de una respiración"],b:[
["cards",["kcloud","ktrach","klungs","kdiaph"],[["<b>We inhale.</b> Air enters through the nose and the mouth. It carries oxygen.","<b>Inhalamos.</b> El aire entra por la nariz y por la boca. Lleva oxígeno."],["<b>The air travels.</b> It goes down the trachea, a tube like a slide, and reaches the lungs.","<b>El aire viaja.</b> Baja por la tráquea, un tubo como un tobogán, y llega a los pulmones."],["<b>In the lungs.</b> The lungs take the oxygen from the air and pass it to the blood.","<b>En los pulmones.</b> Los pulmones toman el oxígeno del aire y lo pasan a la sangre."],["<b>We exhale.</b> The body sends out what it does not need: carbon dioxide.","<b>Exhalamos.</b> El cuerpo saca lo que no necesita: el dióxido de carbono."]],null,""]]},
{h:["Meet the helpers of your breath","Conoce a los ayudantes de tu respiración"],b:[
["cards",["knose","ktrach","klungs","kdiaph"],[["<b>Nose.</b> It warms the air, and tiny hairs inside catch the dust.","<b>Nariz.</b> Calienta el aire, y unos pelitos de su interior atrapan el polvo."],["<b>Trachea.</b> A tube that carries the air down to the lungs.","<b>Tráquea.</b> Un tubo que lleva el aire hacia abajo, hasta los pulmones."],["<b>Lungs.</b> Two soft, spongy bags that fill with air like balloons.","<b>Pulmones.</b> Dos bolsas blandas y esponjosas que se llenan de aire como globos."],["<b>Diaphragm.</b> A muscle under the lungs that moves up and down to help us breathe.","<b>Diafragma.</b> Un músculo debajo de los pulmones que sube y baja para ayudarnos a respirar."]],null,""]]},
{h:["Try it: feel your breath","Pruébalo: siente tu respiración"],b:[
["note",["Do these with an adult. Stop if you feel dizzy.","Hazlo con un adulto. Para si te mareas."]],
["cards",["kdiaph","kmirror","kclock"],[["Put a hand on your tummy. Breathe in slowly through your nose: your tummy goes up. Breathe out: it goes down.","Pon una mano en tu barriga. Inhala despacio por la nariz: la barriga sube. Exhala: baja."],["Breathe out onto a cold mirror or a glass. It gets foggy, because your breath carries tiny drops of water.","Echa el aliento sobre un espejo o un vaso fríos. Se empañan, porque tu aliento lleva gotitas de agua."],["Count your breaths for 30 seconds while you sit calmly. Then do 10 jumps and count again. What changes?","Cuenta tus respiraciones durante 30 segundos mientras estás sentado con calma. Después haz 10 saltos y vuelve a contar. ¿Qué cambia?"]],null,""]]},
{h:["Be kind to your lungs","Cuida tus pulmones"],b:[
["cards",["kplay","kwet","knosmoke","ksneeze","kcloud"],[["Run and play outside every day.","Corre y juega fuera cada día."],["Wash your hands with soap.","Lávate las manos con jabón."],["Stay away from smoke.","Aléjate del humo."],["Cover your cough and sneezes with a tissue or your elbow.","Cúbrete la tos y los estornudos con un pañuelo o con el codo."],["Open the window to let fresh air in.","Abre la ventana para que entre aire fresco."]],null,""]]},
{h:["Note for families and teachers","Nota para familias y profesores"],b:[["ul",[["Breathing speeds up with exercise, excitement or fever. This is normal.","La respiración se acelera con el ejercicio, la emoción o la fiebre. Es normal."],["See a doctor if a child breathes fast or with difficulty, wheezes, has a cough that lasts, or if you see the ribs pulling in or the nostrils flaring when they breathe.","Consulta con un médico si el niño respira rápido o con dificultad, tiene silbidos en el pecho, una tos que no se va, o si se le marcan las costillas o se le abren las aletas de la nariz al respirar."],["Blue or grey lips, or a child who is very sleepy or cannot speak, are an emergency: call your local emergency number.","Los labios azulados o grisáceos, o un niño muy dormido o que no puede hablar, son una urgencia: llama al número de emergencias de tu país."],["If a doctor has prescribed an inhaler or a treatment, follow the plan they gave you.","Si un médico ha recetado un inhalador o un tratamiento, sigue el plan que te dio."],["Keep the home smoke-free and ventilate rooms every day.","Mantén la casa libre de humo y ventila las habitaciones cada día."]]]]},
{h:["Mini quiz","Mini test"],b:[["p",["Tap a question to see the answer.","Toca una pregunta para ver la respuesta."]],["quiz",[[["Which tube is like a slide for the air?","¿Qué tubo es como un tobogán para el aire?"],["The trachea.","La tráquea."]],[["Which gas do we breathe in that our body needs?","¿Qué gas necesita nuestro cuerpo que inhalamos?"],["Oxygen.","El oxígeno."]],[["Which gas do we breathe out?","¿Qué gas exhalamos?"],["Carbon dioxide.","El dióxido de carbono."]],[["How can we cover a cough?","¿Cómo podemos cubrirnos la tos?"],["With a tissue or with our elbow.","Con un pañuelo o con el codo."]]]]]},
{h:["Vocabulary","Vocabulario"],b:[["vocab",[["nose","nariz"],["mouth","boca"],["air","aire"],["lungs","pulmones"],["trachea (windpipe)","tráquea"],["oxygen","oxígeno"],["to breathe","respirar"],["to inhale","inhalar"],["to exhale","exhalar"],["cough","tos"]]]]},
{h:["You are a Breathing Hero!","¡Eres un héroe de la respiración!"],b:[["note",["Draw your favourite place to breathe fresh air and write your name: ______________","Dibuja tu lugar favorito para respirar aire fresco y escribe tu nombre: ______________"]]]}
]};
